<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>時光迴廊 - v3.9 診斷版</title>
    <style>
        /* CSS 樣式與之前版本完全相同 */
        :root { --record-size: 300px; --theme-color-1: #ff8c00; --theme-color-2: #483d8b; --font-family: 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: var(--font-family); overflow: hidden; touch-action: none; background: linear-gradient(135deg, #2a2a3e, #4a3a4a); color: white; user-select: none; -webkit-user-select: none; }
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; justify-content: center; align-items: center; background-color: rgba(0, 0, 0, 0.5); backdrop-filter: blur(5px); text-align: center; transition: opacity 0.5s ease; }
        .screen.active { display: flex; }
        .retro-button { padding: 12px 28px; font-size: 18px; color: white; background: linear-gradient(145deg, var(--theme-color-1), #e06a00); border: 2px solid rgba(255, 255, 255, 0.5); border-radius: 8px; cursor: pointer; margin: 10px; box-shadow: 0 4px 0 #a04a00, 2px 2px 8px rgba(0,0,0,0.5); transition: all 0.1s ease-out; text-shadow: 1px 1px 2px rgba(0,0,0,0.7); }
        .retro-button:active { transform: translateY(2px); box-shadow: 0 2px 0 #a04a00; }
        .retro-button:disabled { background: #888; box-shadow: 0 4px 0 #555; cursor: not-allowed; }
        h1 { font-size: 42px; text-shadow: 2px 2px 8px rgba(0,0,0,0.8); }
        p { opacity: 0.9; }
        #main-menu-screen { background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://source.unsplash.com/random/800x600/?80s,retro,city') no-repeat center center/cover; }
        #main-menu-screen h1 { font-size: 48px; }
        .game-choice-container { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; margin-top: 30px; }
        .game-choice-card { width: 150px; height: 200px; margin: 15px; border: 3px solid rgba(255, 255, 255, 0.7); border-radius: 12px; background: rgba(0,0,0,0.4); display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; transition: all 0.3s ease; }
        .game-choice-card:hover { transform: scale(1.05); border-color: var(--theme-color-1); }
        .game-choice-card .icon { font-size: 60px; }
        .game-choice-card .title { font-size: 24px; margin-top: 15px; font-weight: bold; }
        #song-selection-screen { backdrop-filter: blur(10px); }
        #song-list { width: 90%; max-width: 400px; max-height: 70vh; overflow-y: auto; padding-top: 10px; }
        .song-choice { background-color: rgba(0, 0, 0, 0.3); border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 10px; padding: 15px; margin-bottom: 15px; cursor: pointer; transition: all 0.2s; position: relative; }
        .song-title { font-size: 20px; font-weight: bold; }
        .song-artist { font-size: 14px; opacity: 0.8; margin-top: 5px; }
    </style>
</head>
<body>

    <div id="main-container">
        <div id="timebeat-game-area" class="game-ui-container"><h1>時光節拍 載入成功</h1></div>
        <div id="conductor-game-area" class="game-ui-container"><h1>指揮家 載入成功</h1></div>
        <div id="turntable-game-area" class="game-ui-container"><h1>時光唱盤 載入成功</h1></div>
    </div>

    <div id="main-menu-screen" class="screen active">
        <h1>時光迴廊</h1>
        <p>選擇你的懷舊音樂之旅</p>
        <div class="game-choice-container">
            <div class="game-choice-card" data-gametype="timebeat"> <div class="icon">🎶</div> <div class="title">時光節拍</div> </div>
            <div class="game-choice-card" data-gametype="conductor"> <div class="icon">🎼</div> <div class="title">指揮家</div> </div>
            <div class="game-choice-card" data-gametype="turntable"> <div class="icon">💿</div> <div class="title">時光唱盤</div> </div>
        </div>
    </div>
    
    <div id="song-selection-screen" class="screen">
        <h1 id="song-selection-title">選擇曲目</h1>
        <div id="song-list"></div>
        <button class="retro-button" id="back-to-main-menu-btn">返回主選單</button>
    </div>

    <script>
    // =================================================================================
    //  時光迴廊 H5 遊戲 - v3.9 [診斷版]
    // =================================================================================
    console.log("--- SCRIPT START: 腳本開始執行 ---");

    const allScreens = document.querySelectorAll('.screen');
    const gameUIs = document.querySelectorAll('.game-ui-container');

    // --- 數據物件定義 ---
    console.log("Defining data objects (SongData, SongOrder)...");
    const SongData = {
        timebeat: { tongnian: { title: '童年', artist: '羅大佑' }, tianmimi: { title: '甜蜜蜜', artist: '鄧麗君' } },
        conductor: { yueliang: { title: '月亮代表我的心', artist: '鄧麗君' }, henai: { title: '很愛很愛你', artist: '劉若英' } },
        turntable: { naner: { title: '男兒當自強', artist: '林子祥' }, xiaosa: { title: '瀟灑走一回', artist: '葉倩文' } }
    };
    const SongOrder = { timebeat: ['tongnian', 'tianmimi'], conductor: ['yueliang', 'henai'], turntable: ['naner', 'xiaosa'] };
    console.log("Data objects defined successfully.");

    // --- 核心遊戲管理器 ---
    console.log("Defining Game object...");
    const Game = {
        state: { activeGame: null },
        init() {
            console.log("--- Game.init() CALLED ---");
            try {
                console.log("Attaching listeners to game choice cards...");
                document.querySelectorAll('.game-choice-card').forEach(card => {
                    card.addEventListener('click', () => {
                        console.log(`Game choice clicked: ${card.dataset.gametype}`);
                        this.state.activeGame = card.dataset.gametype;
                        this.showScreen('song-selection-screen');
                        SongSelection.render();
                    });
                });
                console.log("Listeners for game choice attached successfully.");

                document.getElementById('back-to-main-menu-btn').addEventListener('click', () => {
                    console.log("Back to main menu button clicked.");
                    this.showScreen('main-menu-screen');
                });
                console.log("Listener for back button attached successfully.");

                this.showScreen('main-menu-screen');
                console.log("--- Game.init() COMPLETED SUCCESSFULLY ---");
            } catch (error) {
                console.error("!!! CRITICAL ERROR DURING Game.init() !!!", error);
                alert("遊戲初始化時發生嚴重錯誤，請按 F12 查看開發者主控台並將紅色錯誤訊息回報。");
            }
        },
        showScreen(screenId) {
            console.log(`Showing screen: ${screenId}`);
            allScreens.forEach(s => s.classList.remove('active'));
            const targetScreen = document.getElementById(screenId);
            if (targetScreen) {
                targetScreen.classList.add('active');
            } else {
                console.error(`Screen with ID "${screenId}" not found!`);
            }
        },
        startGame(songId) {
            console.log(`Starting game "${this.state.activeGame}" with song "${songId}"`);
            this.showScreen('game-screen'); // Dummy ID to hide all overlays
            gameUIs.forEach(ui => ui.classList.remove('active'));
            document.getElementById(`${this.state.activeGame}-game-area`).classList.add('active');
            alert(`成功進入遊戲《${SongData[this.state.activeGame][songId].title}》！\n\n如果能看到這個提示，表示點擊和跳轉邏輯已完全修復。`);
        }
    };
    console.log("Game object defined successfully.");

    // --- 選曲畫面管理器 ---
    console.log("Defining SongSelection object...");
    const SongSelection = {
        render() {
            console.log(`Rendering song selection for game: ${Game.state.activeGame}`);
            const gameType = Game.state.activeGame;
            const titleMap = { timebeat: '時光節拍', conductor: '指揮樂章', turntable: '懷舊唱盤' };
            document.getElementById('song-selection-title').textContent = titleMap[gameType] || '選擇曲目';
            const songListContainer = document.getElementById('song-list');
            songListContainer.innerHTML = '';
            
            SongOrder[gameType].forEach((songId) => {
                const song = SongData[gameType][songId];
                const songEl = document.createElement('div');
                songEl.className = 'song-choice';
                songEl.innerHTML = `<div class="song-title">${song.title}</div><div class="song-artist">${song.artist}</div>`;
                songEl.addEventListener('click', () => Game.startGame(songId));
                songListContainer.appendChild(songEl);
            });
            console.log("Song selection rendered successfully.");
        }
    };
    console.log("SongSelection object defined successfully.");

    // --- 最終初始化 ---
    console.log("--- ALL OBJECTS DEFINED ---");
    console.log("Calling Game.init() now...");
    Game.init();
    </script>
</body>
</html>
