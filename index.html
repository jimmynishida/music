<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>時光迴廊 - 完整版</title>
    <style>
        :root { --theme-color-1: #ff8c00; --font-family: 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: var(--font-family); overflow: hidden; touch-action: manipulation; background: linear-gradient(135deg, #2a2a3e, #4a3a4a); color: white; user-select: none; -webkit-user-select: none; }
        .screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; justify-content: center; align-items: center; background-color: rgba(0, 0, 0, 0.5); backdrop-filter: blur(5px); text-align: center; transition: opacity 0.5s ease; box-sizing: border-box; padding: 20px; z-index: 200; }
        .screen.active { display: flex; }
        h1, h2, h3 { text-shadow: 2px 2px 8px rgba(0,0,0,0.8); }
        h1 { font-size: clamp(2.5rem, 10vw, 3.5rem); }
        h2 { font-size: clamp(1.8rem, 8vw, 2.5rem); margin-bottom: 20px;}
        .retro-button { padding: 14px 28px; font-size: clamp(1rem, 4.5vw, 1.2rem); color: white; background: linear-gradient(145deg, var(--theme-color-1), #e06a00); border: 2px solid rgba(255, 255, 255, 0.5); border-radius: 12px; cursor: pointer; margin: 10px; min-width: 150px; box-shadow: 0 4px 0 #a04a00; }
        .retro-button:active { transform: translateY(2px); box-shadow: 0 2px 0 #a04a00; }
        #main-menu-screen { background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://source.unsplash.com/random/800x600/?80s,retro,road') no-repeat center center/cover; }
        .main-menu-buttons .retro-button { width: 280px; height: 70px; font-size: 1.8rem; }
        #mode-selection-screen, #song-selection-screen, #profile-screen { justify-content: flex-start; padding-top: 80px; }
        .game-choice-card { width: clamp(100px, 28vw, 150px); height: clamp(120px, 35vw, 200px); margin: 5px; border: 3px solid #fff; border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; text-align: center; }
        .song-list { width: 100%; max-width: 500px; height: calc(100vh - 150px); overflow-y: auto; padding: 0 10px; }
        .song-choice { background-color: rgba(0,0,0,0.3); border: 2px solid rgba(255,255,255,0.3); border-radius: 10px; padding: 15px; margin-bottom: 15px; cursor: pointer; position: relative; padding-bottom: 35px; text-align: left; }
        .song-title { font-size: 1.2rem; font-weight: bold; } .song-artist { font-size: 0.9rem; opacity: 0.8; }
        .game-ui-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; }
        .game-ui-container.active { display: block; }
        .game-stats { display: none; position: fixed; top: 20px; left: 20px; right: 20px; z-index: 50; justify-content: space-between; font-size: 1.5rem; color: white; text-shadow: 2px 2px 4px black; }
        canvas { position: absolute; top:0; left: 0; width: 100%; height: 100%; }

        /* 教學畫面樣式 */
        #tutorial-screen { background: none; backdrop-filter: none; z-index: 300; }
        #tutorial-background { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; transition: opacity 0.3s; z-index: 301; filter: blur(5px) brightness(0.6); }
        #tutorial-content { position: relative; z-index: 302; display: flex; flex-direction: column; justify-content: center; align-items: center; background-color: rgba(0, 0, 0, 0.7); padding: 20px; border-radius: 15px;}
        #tutorial-animation-container { width: 200px; height: 120px; margin-top: 10px; position: relative; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; }
        .finger-icon { font-size: 40px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); will-change: transform; pointer-events: none;}
        .anim-tap { animation: tap-anim 1.5s infinite ease-in-out; }
        .anim-swipe { animation: swipe-anim 2s infinite ease-out; }
        .anim-scratch { animation: scratch-anim 1s infinite ease-in-out; }
        @keyframes tap-anim { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(0.8); } }
        @keyframes swipe-anim { 0% { transform: translate(-80px, -20px); opacity: 0; } 20% { opacity: 1; } 80% { transform: translate(80px, 20px); opacity: 1; } 100% { opacity: 0; } }
        @keyframes scratch-anim { 0%, 100% { transform: translate(-30px, 0) rotate(-15deg); } 50% { transform: translate(30px, 0) rotate(15deg); } }
    </style>
</head>
<body>
    <div id="main-menu-screen" class="screen"></div>
    <div id="mode-selection-screen" class="screen"></div>
    <div id="song-selection-screen" class="screen"></div>
    <div id="end-screen" class="screen"></div>
    <div id="tutorial-screen" class="screen">
        <div id="tutorial-background"></div>
        <div id="tutorial-content">
            <h2>玩法教學</h2>
            <p id="tutorial-text"></p>
            <div id="tutorial-animation-container"></div>
            <button class="retro-button" id="close-tutorial-btn">我明白了！</button>
        </div>
    </div>
    <div id="game-container">
        <div class="game-stats">
            <span>分數: <span id="score">0</span></span>
            <span>連擊: <span id="combo">0</span></span>
        </div>
        <div id="timebeat-game-area" class="game-ui-container"><canvas id="timebeat-canvas"></canvas></div>
        <div id="conductor-game-area" class="game-ui-container"></div>
        <div id="turntable-game-area" class="game-ui-container"></div>
    </div>
    <audio id="game-audio" preload="auto"></audio>
    <audio id="sfx-audio" preload="auto"></audio>

    <script>
    // =================================================================================
    //  時光迴廊 H5 遊戲 - v23.0 (教學功能恢復版)
    // =================================================================================
    document.addEventListener('DOMContentLoaded', () => {
        
        // --- 數據定義 ---
        const SongData = { tianmimi: { title: '甜蜜蜜', beatmapSrc: 'beatmaps/甜蜜蜜.json', audioSrc: 'audio/甜蜜蜜.mp3', duration: 21000, availableModes: ['timebeat', 'turntable'] }, yueliang: { title: '月亮代表我的心', beatmapSrc: 'beatmaps/月亮代表我的心.json', audioSrc: 'audio/月亮代表我的心.mp3', duration: 17000, availableModes: ['timebeat', 'conductor'] }, naner: { title: '男兒當自強', beatmapSrc: 'beatmaps/男兒當自強.json', audioSrc: 'audio/男兒當自強.mp3', duration: 19100, availableModes: ['conductor', 'turntable'] } };
        
        // --- 模組 ---
        const TimeBeat = {
            canvas: null, ctx: null, notes: [], beatmap: [], nextNoteIndex: 0,
            init() { this.canvas = document.getElementById('timebeat-canvas'); this.ctx = this.canvas.getContext('2d'); window.addEventListener('resize', this.resize.bind(this)); },
            resize() { if (this.canvas) { this.canvas.width = window.innerWidth; this.canvas.height = window.innerHeight; } },
            start(beatmap) { this.resize(); this.notes = []; this.nextNoteIndex = 0; this.beatmap = beatmap.map((note, i) => ({ ...note, track: i % 3 })); this.boundHandleTap = this.handleTap.bind(this); this.canvas.addEventListener('pointerdown', this.boundHandleTap); },
            stop() { if(this.canvas) this.canvas.removeEventListener('pointerdown', this.boundHandleTap); },
            update(elapsedTime) {
                while (this.nextNoteIndex < this.beatmap.length && this.beatmap[this.nextNoteIndex].time < elapsedTime + 2000) { this.notes.push({ ...this.beatmap[this.nextNoteIndex], y: 0, active: true }); this.nextNoteIndex++; }
                const hitLineY = this.canvas.height * 0.85;
                this.notes.forEach(note => { if (note.active) { const timeDiff = note.time - elapsedTime; note.y = hitLineY - (timeDiff * 0.8); if (timeDiff < -150) { note.active = false; Game.updateCombo(false); } } });
                this.notes = this.notes.filter(n => n.active || n.y < this.canvas.height + 50);
            },
            draw() {
                if(!this.ctx) return; this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                const hitLineY = this.canvas.height * 0.85;
                this.ctx.fillStyle = 'rgba(255, 215, 0, 0.5)'; this.ctx.fillRect(0, hitLineY - 25, this.canvas.width, 50);
                this.notes.forEach(note => { if (note.active) { const trackWidth = this.canvas.width / 3; const x = trackWidth * note.track + trackWidth / 2; this.ctx.fillStyle = 'cyan'; this.ctx.beginPath(); this.ctx.arc(x, note.y, 30, 0, Math.PI * 2); this.ctx.fill(); } });
            },
            handleTap(e) { if (!Game.state.isPlaying) return; const rect = this.canvas.getBoundingClientRect(); const x = e.clientX - rect.left; const track = Math.floor(x / (this.canvas.width / 3)); Game.handleHit(performance.now() - Game.getStartTime(), { track }); }
        };

        const Conductor = {
             init() { this.gameArea = document.getElementById('conductor-game-area'); },
             start(beatmap) { alert('指揮家模式正在調試中'); Game.showScreen('mode-selection-screen'); },
             stop() {}
        };
        const Turntable = {
             init() { this.gameArea = document.getElementById('turntable-game-area'); },
             start(beatmap) { alert('時光唱盤模式正在調試中'); Game.showScreen('mode-selection-screen'); },
             stop() {}
        };
        
        const Tutorial = {
            init(domRefs) {
                this.screen = domRefs.tutorialScreen;
                this.backgroundEl = this.screen.querySelector('#tutorial-background');
                this.textEl = this.screen.querySelector('#tutorial-text');
                this.animationContainer = this.screen.querySelector('#tutorial-animation-container');
                this.shownForModes = JSON.parse(localStorage.getItem('tutorialShown') || '{}');
            },
            shouldShow(gameMode) { return !this.shownForModes[gameMode]; },
            generateBackground(gameMode) {
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = window.innerWidth; tempCanvas.height = window.innerHeight;
                const tempCtx = tempCanvas.getContext('2d');
                if (gameMode === 'timebeat' && TimeBeat.canvas) {
                    TimeBeat.draw.call({ctx: tempCtx, canvas: tempCanvas, notes: []});
                } else {
                    tempCtx.fillStyle = '#1a1a1a';
                    tempCtx.fillRect(0,0,tempCanvas.width, tempCanvas.height);
                }
                this.backgroundEl.style.backgroundImage = `url(${tempCanvas.toDataURL()})`;
            },
            show(gameMode) {
                return new Promise(resolve => {
                    const content = {
                        timebeat: { text: '當音符下落到判定線時，點擊對應軌道！', animClass: 'anim-tap' },
                        conductor: { text: '跟隨指揮棒的軌跡，在音符上滑動！', animClass: 'anim-swipe' },
                        turntable: { text: '當音符經過唱針時，藍色點擊，紅色搓盤！', animClass: 'anim-scratch' }
                    };
                    if (!content[gameMode]) { resolve(); return; }

                    this.generateBackground(gameMode);
                    this.textEl.textContent = content[gameMode].text;
                    this.animationContainer.innerHTML = `<div class="finger-icon ${content[gameMode].animClass}">👆</div>`;
                    this.screen.classList.add('active');

                    const closeBtn = this.screen.querySelector('#close-tutorial-btn');
                    const closeHandler = () => {
                        this.screen.classList.remove('active');
                        this.shownForModes[gameMode] = true;
                        localStorage.setItem('tutorialShown', JSON.stringify(this.shownForModes));
                        closeBtn.removeEventListener('click', closeHandler);
                        resolve();
                    };
                    closeBtn.addEventListener('click', closeHandler);
                });
            }
        };

        const Game = {
            state: { activeGame: null, currentSongId: null, score: 0, combo: 0, isPlaying: false, startTime: 0, beatmap: [] },
            dom: {},
            modules: { timebeat: TimeBeat, conductor: Conductor, turntable: Turntable },

            init() {
                this.cacheDOM();
                this.injectHTML();
                this.attachListeners();
                Object.values(this.modules).forEach(m => m.init?.());
                Tutorial.init(this.dom);
                this.showScreen('main-menu-screen');
                console.log("Game Initialized Successfully.");
            },
            cacheDOM() {
                this.dom.screens = document.querySelectorAll('.screen');
                this.dom.mainMenu = document.getElementById('main-menu-screen');
                this.dom.modeSelection = document.getElementById('mode-selection-screen');
                this.dom.songSelection = document.getElementById('song-selection-screen');
                this.dom.endScreen = document.getElementById('end-screen');
                this.dom.tutorialScreen = document.getElementById('tutorial-screen');
                this.dom.gameStats = document.querySelector('.game-stats');
                this.dom.score = document.getElementById('score');
                this.dom.combo = document.getElementById('combo');
                this.dom.finalScore = document.getElementById('final-score');
                this.dom.gameAudio = document.getElementById('game-audio');
                this.dom.gameUiContainers = document.querySelectorAll('.game-ui-container');
            },
            injectHTML() {
                this.dom.mainMenu.innerHTML = `<h1>時光迴廊</h1><button class="retro-button" id="start-btn">開始遊戲</button><div class="version-display">v23.0</div>`;
                this.dom.modeSelection.innerHTML = `<h1>選擇模式</h1><div style="display:flex;"><div class="game-choice-card" data-gametype="timebeat"><h2>時光節拍</h2></div><div class="game-choice-card" data-gametype="conductor"><h2>指揮家</h2></div><div class="game-choice-card" data-gametype="turntable"><h2>時光唱盤</h2></div></div><button class="retro-button" id="back-to-main-btn">返回主選單</button>`;
                this.dom.songSelection.innerHTML = `<h1 id="song-list-title">選擇歌曲</h1><div id="song-list" style="width:100%; max-width: 400px; height: 70%; overflow-y: auto;"></div><button class="retro-button" id="back-to-mode-btn">返回模式選擇</button>`;
                this.dom.endScreen.innerHTML = `<h1>演奏結束</h1><p>得分: <span id="final-score">0</span></p><button class="retro-button" id="retry-btn">重試</button><button class="retro-button" id="back-to-songs-btn">返回選曲</button>`;
            },
            attachListeners() {
                this.dom.mainMenu.addEventListener('click', (e) => { if (e.target.id === 'start-btn') this.showScreen('mode-selection-screen'); });
                this.dom.modeSelection.addEventListener('click', async (e) => {
                    const card = e.target.closest('.game-choice-card');
                    if (card) {
                        this.state.activeGame = card.dataset.gametype;
                        if (Tutorial.shouldShow(this.state.activeGame)) {
                            await Tutorial.show(this.state.activeGame);
                        }
                        this.renderSongList();
                        this.showScreen('song-selection-screen');
                    }
                    if (e.target.id === 'back-to-main-btn') this.showScreen('main-menu-screen');
                });
                this.dom.songSelection.addEventListener('click', (e) => { if (e.target.id === 'back-to-mode-btn') this.showScreen('mode-selection-screen'); });
                this.dom.endScreen.addEventListener('click', (e) => {
                    if (e.target.id === 'retry-btn') this.startGame(this.state.currentSongId);
                    if (e.target.id === 'back-to-songs-btn') this.showScreen('song-selection-screen');
                });
            },
            showScreen(screenId) {
                this.dom.screens.forEach(s => s.classList.remove('active'));
                this.dom.gameStats.style.display = 'none';
                this.dom.gameUiContainers.forEach(c => c.classList.remove('active'));
                if (screenId === 'none') {
                    this.dom.gameStats.style.display = 'flex';
                    const gameArea = document.getElementById(`${this.state.activeGame}-game-area`);
                    if (gameArea) gameArea.classList.add('active');
                } else {
                    const screen = document.getElementById(screenId);
                    if (screen) screen.classList.add('active');
                }
            },
            renderSongList() {
                const songList = this.dom.songSelection.querySelector('#song-list');
                songList.innerHTML = '';
                for (const songId in SongData) {
                    const song = SongData[songId];
                    if (song.availableModes.includes(this.state.activeGame)) {
                        const el = document.createElement('div');
                        el.className = 'song-choice';
                        el.textContent = song.title;
                        el.onclick = () => this.startGame(songId);
                        songList.appendChild(el);
                    }
                }
            },
            async startGame(songId) {
                this.state.currentSongId = songId;
                const song = SongData[songId];
                try {
                    const response = await fetch(song.beatmapSrc);
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    const rawBeatmap = await response.json();
                    this.state.beatmap = rawBeatmap.filter(e => e.type === 'tap').map(e => ({ time: e.time * 1000, type: e.type }));
                } catch (e) { alert("譜面載入失敗: " + e.message); return; }
                Object.assign(this.state, { score: 0, combo: 0, maxCombo: 0 });
                this.dom.score.textContent = 0; this.dom.combo.textContent = 0;
                this.showScreen('none');
                const gameModule = this.modules[this.state.activeGame];
                setTimeout(() => {
                    this.state.isPlaying = true; this.state.startTime = performance.now();
                    this.dom.gameAudio.src = song.audioSrc;
                    this.dom.gameAudio.play().catch(e => console.error("Audio play failed:", e));
                    gameModule.start(this.state.beatmap);
                    this.gameLoop();
                }, 1000);
            },
            gameLoop() {
                if (!this.state.isPlaying) return;
                const elapsedTime = performance.now() - this.state.startTime;
                const gameModule = this.modules[this.state.activeGame];
                gameModule.update(elapsedTime);
                gameModule.draw();
                if (elapsedTime >= SongData[this.state.currentSongId].duration) { this.endGame(); return; }
                this.state.animationFrameId = requestAnimationFrame(this.gameLoop.bind(this));
            },
            handleHit(elapsedTime, hitData) {
                const gameModule = this.modules[this.state.activeGame];
                if (!gameModule || !gameModule.notes) return;
                let noteToHit = null;
                if (this.state.activeGame === 'timebeat') {
                    noteToHit = gameModule.notes.find(n => n.active && n.track === hitData.track && Math.abs(n.time - elapsedTime) < 150);
                }
                if (noteToHit) {
                    noteToHit.active = false;
                    this.state.score += 100 + this.state.combo;
                    this.updateCombo(true);
                }
            },
            updateCombo(isHit){
                if(isHit) this.state.combo++;
                else this.state.combo = 0;
                this.dom.combo.textContent = this.state.combo;
                this.dom.score.textContent = this.state.score;
            },
            endGame() {
                this.state.isPlaying = false;
                if(this.state.animationFrameId) cancelAnimationFrame(this.state.animationFrameId);
                this.modules[this.state.activeGame].stop();
                this.dom.gameAudio.pause();
                this.dom.finalScore.textContent = this.state.score;
                this.showScreen('end-screen');
            },
            getStartTime: () => Game.state.startTime,
        };
        
        Game.init();
    });
    </script>
</body>
</html>
