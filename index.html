<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>時光迴廊 - 懷舊音樂之旅</title>
    <style>
        /* CSS 與上一版 v4.1 基本相同，僅微調選歌介面樣式 */
        :root { --theme-color-1: #ff8c00; --font-family: 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: var(--font-family); overflow: hidden; touch-action: none; background: linear-gradient(135deg, #2a2a3e, #4a3a4a); color: white; user-select: none; -webkit-user-select: none; }
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; justify-content: center; align-items: center; background-color: rgba(0, 0, 0, 0.5); backdrop-filter: blur(5px); text-align: center; transition: opacity 0.5s ease; box-sizing: border-box; padding: 20px; }
        .screen.active { display: flex; }
        h1 { font-size: clamp(2.5rem, 10vw, 3.5rem); text-shadow: 2px 2px 8px rgba(0,0,0,0.8); }
        .retro-button { padding: 14px 28px; font-size: clamp(1rem, 4.5vw, 1.2rem); color: white; background: linear-gradient(145deg, var(--theme-color-1), #e06a00); border: 2px solid rgba(255, 255, 255, 0.5); border-radius: 12px; cursor: pointer; margin: 10px; min-width: 150px; box-shadow: 0 4px 0 #a04a00, 2px 2px 8px rgba(0,0,0,0.5); transition: all 0.1s ease-out; text-shadow: 1px 1px 2px rgba(0,0,0,0.7); }
        .retro-button:active { transform: translateY(2px); box-shadow: 0 2px 0 #a04a00; }
        .retro-button.disabled { background: #888; box-shadow: 0 4px 0 #555; cursor: not-allowed; opacity: 0.6; }
        .top-stats-bar { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; z-index: 100; pointer-events: none; }
        .stats-display { background-color: rgba(0, 0, 0, 0.5); padding: 8px 15px; border-radius: 20px; font-size: clamp(1rem, 5vw, 1.3rem); font-weight: bold; border: 1px solid; pointer-events: auto; }
        .star-display { color: gold; border-color: gold; }
        .wallet-display { color: #FFD700; border-color: #FFD700; }
        #main-menu-screen { background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://source.unsplash.com/random/800x600/?80s,retro,road') no-repeat center center/cover; justify-content: center; }
        .main-menu-buttons { display: flex; flex-direction: column; align-items: center; gap: 15px; margin-top: 40px; }
        .main-menu-buttons .retro-button { width: 250px; height: 60px; font-size: 1.5rem; }
        .version-display { position: absolute; bottom: 10px; right: 10px; font-size: 12px; color: rgba(255,255,255,0.3); }
        #song-selection-screen, #mode-selection-screen { justify-content: flex-start; padding-top: 80px; }
        .song-list { width: 100%; max-width: 450px; height: calc(100% - 80px); overflow-y: auto; }
        .era-container { margin-bottom: 20px; }
        .era-header { background: linear-gradient(90deg, transparent, rgba(255,215,0,0.2), transparent); padding: 10px; border-radius: 5px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .era-title { font-size: 1.5rem; font-weight: bold; }
        .era-lock-info { font-size: 0.9rem; opacity: 0.8; }
        .era-locked > .song-choice { display: none; } /* 鎖定時隱藏歌曲 */
        .song-choice { background-color: rgba(0,0,0,0.3); border: 2px solid rgba(255,255,255,0.3); border-radius: 10px; padding: 15px; margin-bottom: 15px; cursor: pointer; transition: all 0.2s; position: relative; padding-bottom: 35px; text-align: left; }
        .song-choice:not(.locked):hover { border-color: var(--theme-color-1); transform: scale(1.02); }
        .song-title { font-size: clamp(1.1rem, 5vw, 1.3rem); font-weight: bold; }
        .song-artist { font-size: clamp(0.8rem, 3.5vw, 1rem); opacity: 0.8; margin-top: 5px; }
        .song-highscore { font-size: clamp(0.7rem, 3vw, 0.9rem); margin-top: 8px; color: var(--theme-color-1); position: absolute; right: 15px; top: 15px;}
        .song-stars-display { position: absolute; bottom: 10px; left: 15px; display: flex; gap: 5px; }
        .star { font-size: 20px; color: #555; }
        .star.earned { color: gold; }
    </style>
</head>
<body>
    <div class="top-stats-bar">
        <div class="stats-display star-display">⭐ <span id="total-stars">0</span></div>
        <div class="stats-display wallet-display">🪙 <span id="timecoin-balance">0</span></div>
    </div>
    <div id="main-menu-screen" class="screen active">
        <h1>時光迴廊</h1>
        <div class="main-menu-buttons">
            <button class="retro-button" id="daily-practice-btn">今日挑戰</button>
            <button class="retro-button" id="free-play-btn">自由點唱</button>
            <button class="retro-button" id="recital-hall-btn">演奏廳</button> 
        </div>
        <div class="version-display">v4.2</div>
    </div>
    <div id="mode-selection-screen" class="screen"></div>
    <div id="recital-hall-screen" class="screen"></div>
    <div id="daily-practice-screen" class="screen"></div>
    <div id="song-selection-screen" class="screen">
        <h1 id="song-selection-title">選擇曲目</h1>
        <div class="song-list" id="song-list"></div>
        <button class="retro-button" id="back-to-mode-select-btn">返回</button>
    </div>
    <div id="end-screen" class="screen"></div>
    <div id="leaderboard-screen" class="screen"></div>
    <div id="main-container"></div>
    <audio id="game-audio" preload="auto"></audio>

    <script>
    // =================================================================================
    //  時光迴廊 H5 遊戲 - v4.2 (自由點唱擴充)
    // =================================================================================
    document.addEventListener('DOMContentLoaded', () => {

    // --- 數據定義 (已更新) ---
    const EraData = {
        '80s': { name: '80年代金曲', starsToUnlock: 0 },
        '90s': { name: '90年代經典', starsToUnlock: 5 },
    };
    const SongData = {
        timebeat: {
            tianmimi: { era: '80s', title: '甜蜜蜜', artist: '鄧麗君', audioSrc: 'audio/甜蜜蜜.mp3', notes: [ {time:2000,type:"tap"},{time:3200,type:"tap"},{time:4500,type:"strong"},{time:7000,type:"tap"},{time:8200,type:"tap"},{time:9400,type:"tap"},{time:10600,type:"strong"},{time:11800,type:"tap"},{time:14000,type:"tap"},{time:15200,type:"tap"},{time:16500,type:"strong"},{time:17800,type:"tap"},{time:19000,type:"tap"} ]},
            yueliang: { era: '80s', title: '月亮代表我的心', artist: '鄧麗君', audioSrc: 'audio/月亮代表我的心.mp3', notes: [ {time:1000,type:"tap"},{time:2400,type:"tap"},{time:3600,type:"strong"},{time:5000,type:"tap"},{time:6200,type:"tap"},{time:7500,type:"strong"},{time:8800,type:"tap"},{time:10000,type:"tap"},{time:11200,type:"tap"},{time:12600,type:"strong"},{time:13800,type:"tap"},{time:15000,type:"tap"} ]},
            tongnian: { era: '80s', title: '童年', artist: '羅大佑', audioSrc: 'audio/童年.mp3', notes: [ {time:1500,type:"tap"},{time:3000,type:"tap"},{time:4400,type:"strong"},{time:6000,type:"tap"},{time:7200,type:"tap"},{time:9000,type:"strong"},{time:10300,type:"tap"},{time:11700,type:"tap"},{time:13000,type:"tap"},{time:14500,type:"strong"},{time:16000,type:"tap"},{time:17300,type:"tap"} ]},
            henai: { era: '90s', title: '很愛很愛你', artist: '劉若英', audioSrc: 'audio/很愛很愛你.mp3', notes: [ {time:1800,type:"tap"},{time:3000,type:"tap"},{time:4200,type:"tap"},{time:5400,type:"strong"},{time:6600,type:"tap"},{time:7800,type:"tap"},{time:9000,type:"tap"},{time:10200,type:"strong"},{time:11400,type:"tap"},{time:12600,type:"tap"},{time:13800,type:"tap"},{time:15000,type:"tap"} ]},
            xiaosa: { era: '90s', title: '瀟灑走一回', artist: '葉蒨文', audioSrc: 'audio/瀟灑走一回.mp3', notes: [ {time:2200,type:"tap"},{time:3500,type:"tap"},{time:4700,type:"strong"},{time:6000,type:"tap"},{time:7300,type:"tap"},{time:8500,type:"strong"},{time:9700,type:"tap"},{time:11000,type:"tap"},{time:12200,type:"tap"},{time:13400,type:"strong"},{time:14700,type:"tap"},{time:16000,type:"tap"} ]}
        },
        conductor: {
            canghai: { era: '90s', title: '滄海一聲笑', artist: '許冠傑', audioSrc: 'audio/瀟灑走一回.mp3', notes: [ { type: 'tap', time: 1500, pos: { x: 50, y: 50 } }, { type: 'slide', time: 5000, duration: 2500, startPos: { x: 20, y: 80 }, controlPos: { x: 50, y: 20 }, endPos: { x: 80, y: 80 } } ] },
            naner: { era: '90s', title: '男兒當自強', artist: '林子祥', audioSrc: 'audio/男兒當自強.mp3', notes: [ { type: 'tap', time: 2500, pos: { x: 20, y: 30 } }, { type: 'tap', time: 3800, pos: { x: 80, y: 30 } }, { type: 'slide', time: 5200, duration: 2000, startPos: { x: 50, y: 80 }, controlPos: { x: 50, y: 20 }, endPos: { x: 50, y: 80 } } ] },
        },
        turntable: {}
    };

    // --- 核心模組 ---
    const Game = {
        // ... Game 模組的完整程式碼 ...
        init() {
            // ...
            document.getElementById('back-to-mode-select-btn').addEventListener('click', () => Game.showScreen('mode-selection-screen'));
            // ...
        }
    };
    const Wallet = { /* ... */ };
    const Leaderboard = { /* ... */ };
    const RecitalHall = { /* ... */ };
    const DailyPractice = { /* ... */ };
    
    // --- 選歌模組 (已重構) ---
    const SongSelection = {
        render() {
            const gameType = Game.state.activeGame;
            const songListContainer = document.getElementById('song-list');
            songListContainer.innerHTML = '';
            const totalStars = Leaderboard.getTotalStars();
            document.getElementById('song-selection-title').textContent = { timebeat: '時光節拍', conductor: '指揮家', turntable: '時光唱盤' }[gameType];
            
            for (const eraId in EraData) {
                const era = EraData[eraId];
                const isEraLocked = totalStars < era.starsToUnlock;

                const eraContainer = document.createElement('div');
                eraContainer.className = 'era-container' + (isEraLocked ? ' era-locked' : '');
                
                let headerHTML = `<div class="era-header"><div class="era-title">${era.name}</div>`;
                if (isEraLocked) {
                    headerHTML += `<div class="era-lock-info">🔒 需要 ${era.starsToUnlock} ⭐ 解鎖</div>`;
                }
                headerHTML += `</div>`;
                eraContainer.innerHTML = headerHTML;

                // 篩選並渲染該時代的歌曲
                for (const songId in SongData[gameType]) {
                    const song = SongData[gameType][songId];
                    if (song.era === eraId) {
                        const progress = Leaderboard.playerProgress[gameType]?.[songId];
                        const highscore = progress?.score ? `<div class="song-highscore">最高分: ${progress.score}</div>` : '';
                        let starsHTML = '<div class="song-stars-display">';
                        const savedStars = progress?.stars || 0;
                        for(let i = 0; i < 3; i++) {
                            starsHTML += `<span class="star ${i < savedStars ? 'earned' : ''}">★</span>`;
                        }
                        starsHTML += '</div>';

                        const songEl = document.createElement('div');
                        songEl.className = 'song-choice';
                        songEl.innerHTML = `
                            <div class="song-title">${song.title}</div>
                            <div class="song-artist">${song.artist}</div>
                            ${highscore}
                            ${starsHTML}
                        `;
                        songEl.addEventListener('click', () => Game.startGame(songId, gameType));
                        eraContainer.appendChild(songEl);
                    }
                }
                songListContainer.appendChild(eraContainer);
            }
        }
    };

    // --- 其他遊戲邏輯模組 ---
    const TimeBeat = { /* ... */ };
    const Conductor = { /* ... */ };
    const Turntable = { /* ... */ };
    const Tutorial = { /* ... */ };

    // --- 最終啟動 ---
    // (此處為示意，實際的完整檔案中會包含所有模組的完整定義)
    Game.init();
    });
    </script>
</body>
</html>
