<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>時光迴廊 - 懷舊音樂之旅</title>
    <style>
        :root { --theme-color-1: #ff8c00; --font-family: 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: var(--font-family); overflow: hidden; touch-action: none; background: linear-gradient(135deg, #2a2a3e, #4a3a4a); color: white; user-select: none; -webkit-user-select: none; }
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; justify-content: center; align-items: center; background-color: rgba(0, 0, 0, 0.5); backdrop-filter: blur(5px); text-align: center; transition: opacity 0.5s ease; box-sizing: border-box; padding: 20px; }
        .screen.active { display: flex; }
        h1 { font-size: clamp(2.5rem, 10vw, 3.5rem); text-shadow: 2px 2px 8px rgba(0,0,0,0.8); }
        .retro-button { padding: 14px 28px; font-size: clamp(1rem, 4.5vw, 1.2rem); color: white; background: linear-gradient(145deg, var(--theme-color-1), #e06a00); border: 2px solid rgba(255, 255, 255, 0.5); border-radius: 12px; cursor: pointer; margin: 10px; min-width: 150px; box-shadow: 0 4px 0 #a04a00, 2px 2px 8px rgba(0,0,0,0.5); transition: all 0.1s ease-out; text-shadow: 1px 1px 2px rgba(0,0,0,0.7); }
        .retro-button:active { transform: translateY(2px); box-shadow: 0 2px 0 #a04a00; }
        .retro-button.disabled { background: #888; box-shadow: 0 4px 0 #555; cursor: not-allowed; opacity: 0.6; }
        .top-stats-bar { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; z-index: 100; pointer-events: none; }
        .stats-display { background-color: rgba(0, 0, 0, 0.5); padding: 8px 15px; border-radius: 20px; font-size: clamp(1rem, 5vw, 1.3rem); font-weight: bold; border: 1px solid; }
        .star-display { color: gold; border-color: gold; }
        .wallet-display { color: #FFD700; border-color: #FFD700; }
        #main-menu-screen { background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://source.unsplash.com/random/800x600/?80s,retro,road') no-repeat center center/cover; justify-content: center; }
        .main-menu-buttons { display: flex; flex-direction: column; align-items: center; gap: 15px; margin-top: 40px; }
        .main-menu-buttons .retro-button { width: 250px; height: 60px; font-size: 1.5rem; }
        .version-display { position: absolute; bottom: 10px; right: 10px; font-size: 12px; color: rgba(255,255,255,0.3); }
        #recital-hall-screen { justify-content: flex-start; padding-top: 80px; }
        .challenge-info-panel { background-color: rgba(0,0,0,0.3); border: 2px solid var(--theme-color-1); border-radius: 15px; padding: 20px; width: 100%; max-width: 450px; margin-bottom: 20px; }
        #challenge-song-title { font-size: 1.8rem; margin: 0 0 5px 0; color: var(--theme-color-1); }
        #challenge-song-artist { font-size: 1rem; opacity: 0.8; margin: 0 0 15px 0; }
        #challenge-timer, #challenge-personal-best { font-size: 1rem; margin: 5px 0; }
        #challenge-leaderboard { width: 100%; max-width: 450px; flex-grow: 1; overflow-y: auto; background-color: rgba(0,0,0,0.2); border-radius: 10px; padding: 10px; }
        #challenge-leaderboard-list { list-style: none; padding: 0; margin: 0; }
        #challenge-leaderboard-list li { display: flex; justify-content: space-between; padding: 10px; margin-bottom: 5px; background: rgba(255,255,255,0.05); border-radius: 5px; }
        #challenge-leaderboard-list li:first-child { background: var(--theme-color-1); font-weight: bold; }
        .recital-hall-buttons { display: flex; flex-direction: column; align-items: center; margin-top: 20px; width: 100%;}
    </style>
</head>
<body>
    <div class="top-stats-bar">
        <div class="stats-display star-display">⭐ <span id="total-stars">0</span></div>
        <div class="stats-display wallet-display">🪙 <span id="timecoin-balance">0</span></div>
    </div>
    <div id="main-menu-screen" class="screen active">
        <h1>時光迴廊</h1>
        <div class="main-menu-buttons">
            <button class="retro-button" id="daily-practice-btn">今日挑戰</button>
            <button class="retro-button" id="free-play-btn">自由點唱</button>
            <button class="retro-button" id="recital-hall-btn">演奏廳</button> 
        </div>
        <div class="version-display">v3.6</div>
    </div>
    <div id="mode-selection-screen" class="screen"></div>
    <div id="recital-hall-screen" class="screen">
        <h1>演奏廳</h1>
        <div class="challenge-info-panel">
            <h2 id="challenge-song-title">讀取中...</h2>
            <p id="challenge-song-artist">...</p>
            <div id="challenge-timer">計算中...</div>
            <div id="challenge-personal-best">個人最佳: 0</div>
        </div>
        <div id="challenge-leaderboard"><ol id="challenge-leaderboard-list"></ol></div>
        <div class="recital-hall-buttons">
            <button class="retro-button" id="start-challenge-btn">開始挑戰</button>
            <button class="retro-button" id="back-from-recital-btn" style="background: #555;">返回主選單</button>
        </div>
    </div>
    <div id="daily-practice-screen" class="screen"></div>
    <div id="song-selection-screen" class="screen"></div>
    <div id="end-screen" class="screen"></div>
    <div id="leaderboard-screen" class="screen"></div>
    <div id="main-container"></div>
    <audio id="game-audio" preload="auto"></audio>

</body>
</html>
