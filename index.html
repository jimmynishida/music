<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>時光迴廊 - 懷舊音樂之旅</title>
    <style>
        /* --- 全局與佈局 --- */
        :root {
            --theme-color-1: #ff8c00; /* 溫暖的橙色 */
            --font-family: 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: var(--font-family);
            overflow: hidden;
            touch-action: none;
            background: linear-gradient(135deg, #2a2a3e, #4a3a4a);
            color: white;
            user-select: none;
            -webkit-user-select: none;
        }
        .screen {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            text-align: center;
            transition: opacity 0.5s ease;
            box-sizing: border-box;
            padding: 20px;
        }
        .screen.active { display: flex; }
        h1 { font-size: clamp(2.5rem, 10vw, 3.5rem); text-shadow: 2px 2px 8px rgba(0,0,0,0.8); }
        p { font-size: clamp(1rem, 4vw, 1.2rem); opacity: 0.9; }

        /* --- 手機版優化：按鈕樣式 --- */
        .retro-button {
            padding: 14px 28px;
            font-size: clamp(1rem, 4.5vw, 1.2rem);
            color: white;
            background: linear-gradient(145deg, var(--theme-color-1), #e06a00);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            cursor: pointer;
            margin: 10px;
            min-width: 150px;
            box-shadow: 0 4px 0 #a04a00, 2px 2px 8px rgba(0,0,0,0.5);
            transition: all 0.1s ease-out;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.7);
        }
        .retro-button:active { transform: translateY(2px); box-shadow: 0 2px 0 #a04a00; }
        
        /* --- 主選單 --- */
        #main-menu-screen { background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://source.unsplash.com/random/800x600/?80s,retro,city') no-repeat center center/cover; }
        #main-menu-screen p { margin: 10px 0 20px 0; }
        .game-choice-container { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; width: 100%; }
        .game-choice-card {
            width: clamp(130px, 35vw, 160px);
            height: clamp(180px, 48vw, 220px);
            margin: 10px;
            border: 3px solid rgba(255, 255, 255, 0.7); border-radius: 12px;
            background: rgba(0,0,0,0.4);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            cursor: pointer; transition: all 0.3s ease;
        }
        .game-choice-card:hover { transform: scale(1.05); border-color: var(--theme-color-1); }
        .game-choice-card .icon { font-size: clamp(3rem, 15vw, 4rem); }
        .game-choice-card .title { font-size: clamp(1.2rem, 5vw, 1.5rem); margin-top: 15px; font-weight: bold; }

        /* --- 玩法示範教學 --- */
        #tutorial-screen .tutorial-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 60vh;
            max-height: 500px;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid var(--theme-color-1);
            border-radius: 15px;
            overflow: hidden;
        }
        #tutorial-screen h2 { font-size: clamp(1.5rem, 6vw, 2rem); margin: 15px 0; color: var(--theme-color-1); text-shadow: 1px 1px 2px #000; }
        .tutorial-item { position: absolute; width: 100%; height: 100%; opacity: 0; transition: opacity 0.8s ease-in-out; }
        .tutorial-item.active { opacity: 1; }
        .tutorial-text { position: absolute; bottom: 10px; left: 0; width: 100%; font-size: clamp(0.9rem, 4vw, 1.1rem); background: rgba(0,0,0,0.5); padding: 8px 0; }
        
        /* 教學動畫元素 */
        .demo-judgement-line { position: absolute; bottom: 25%; left: 10%; width: 80%; height: 8px; background: gold; border-radius: 4px; box-shadow: 0 0 10px gold; }
        .demo-track { position: absolute; bottom: 25%; width: 2px; height: 65%; background: rgba(255,255,255,0.3); }
        .demo-note { position: absolute; width: 40px; height: 40px; background: cyan; border-radius: 50%; box-shadow: 0 0 15px cyan; transform: translateX(-50%); }
        .demo-finger {
            width: 50px; height: 50px; background: rgba(255,255,255,0.7); border-radius: 50%;
            position: absolute; box-shadow: 0 0 15px white; border: 2px solid white;
            transform: translate(-50%, -50%); opacity: 0;
        }
        
        /* --- 歌曲選擇 --- */
        #song-selection-screen #song-list { width: 100%; max-width: 450px; max-height: 70vh; overflow-y: auto; padding: 10px; }
        .song-choice { background-color: rgba(0,0,0,0.3); border: 2px solid rgba(255,255,255,0.3); border-radius: 10px; padding: 15px; margin-bottom: 15px; cursor: pointer; transition: all 0.2s; position: relative; }
        .song-choice:not(.locked):hover { border-color: var(--theme-color-1); transform: scale(1.02); }
        .song-choice.locked { cursor: not-allowed; background-color: rgba(0,0,0,0.5); color: #888; }
        .song-title { font-size: clamp(1.1rem, 5vw, 1.3rem); font-weight: bold; }
        .song-artist { font-size: clamp(0.8rem, 3.5vw, 1rem); opacity: 0.8; margin-top: 5px; }
        .song-highscore, .song-unlock-condition { font-size: clamp(0.7rem, 3vw, 0.9rem); margin-top: 8px; color: var(--theme-color-1); }
        .lock-icon { font-size: clamp(1.5rem, 6vw, 1.8rem); position: absolute; right: 15px; top: 50%; transform: translateY(-50%); opacity: 0.7; }
        
        /* 遊戲區域 */
        .game-ui-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; pointer-events: none; }
        .game-ui-container.active { display: block; }
        .game-background { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; transition: filter 0.5s ease-out; z-index: -1; }
        #timebeat-game-area canvas { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; }

        /* 結束畫面 */
        #end-screen-content { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #poster-preview-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 100; }
        #poster-canvas { border: 2px solid white; border-radius: 10px; max-width: 90vw; max-height: 90vh; object-fit: contain; }

        /* 教學動畫 Keyframes */
        @keyframes note-fall { from { top: 10%; } to { top: 75%; } }
        @keyframes finger-tap {
            0%, 100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
            10%, 90% { opacity: 1; }
            50% { transform: translate(-50%, -50%) scale(0.9); }
        }
        @keyframes random-note-appear {
             0%, 100% { opacity: 0; transform: scale(0.5); }
             10%, 90% { opacity: 1; transform: scale(1); }
        }
        @keyframes record-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="main-container">
        <div id="conductor-game-area" class="game-ui-container">
             <div class="game-background"></div>
        </div>
        <div id="turntable-game-area" class="game-ui-container">
             <div class="game-background"></div>
        </div>
        <div id="timebeat-game-area" class="game-ui-container">
            <div class="game-background"></div>
            <div class="combo-display"></div>
            <canvas id="timebeat-canvas"></canvas>
        </div>
        <div class="game-stats" style="display: none;">
            <div>分數: <span id="score">0</span></div>
            <div>連擊: <span id="combo">0</span></div>
        </div>
    </div>

    <div id="main-menu-screen" class="screen active">
        <h1>時光迴廊</h1>
        <p>選擇你的懷舊音樂之旅</p>
        <div class="game-choice-container">
            <div class="game-choice-card" data-gametype="timebeat">
                <div class="icon">🎶</div>
                <div class="title">時光節拍</div>
            </div>
            <div class="game-choice-card" data-gametype="conductor">
                <div class="icon">🎼</div>
                <div class="title">指揮家</div>
            </div>
            <div class="game-choice-card" data-gametype="turntable">
                <div class="icon">💿</div>
                <div class="title">時光唱盤</div>
            </div>
        </div>
        <button class="retro-button" id="show-tutorial-btn">玩法示範</button>
    </div>

    <div id="tutorial-screen" class="screen">
        <h2>玩法示範</h2>
        <div class="tutorial-container">
             </div>
        <button class="retro-button" id="skip-tutorial-btn">返回主選單</button>
    </div>

    <div id="song-selection-screen" class="screen">
        <h1 id="song-selection-title">選擇曲目</h1>
        <div id="song-list"></div>
        <button class="retro-button" id="back-to-main-menu-btn">返回主選單</button>
    </div>

    <div id="end-screen" class="screen">
        <div id="end-screen-content">
            <h1 id="end-title">演奏結束</h1>
            <p style="font-size: 24px;">最終得分: <span id="final-score">0</span></p>
            <p>最高連擊: <span id="max-combo">0</span></p>
            <p>準確率: <span id="accuracy">0%</span></p>
            <p style="font-size: 32px; font-weight: bold; color: gold;">評級: <span id="rating-badge"></span></p>
            <button id="poster-button" class="retro-button">生成勳章海報</button>
            <button id="view-leaderboard-btn" class="retro-button">查看排行榜</button>
            <button id="retry-button" class="retro-button">再次嘗試</button>
            <button id="back-to-song-menu-btn" class="retro-button">返回選曲</button>
        </div>
    </div>
    
    <div id="leaderboard-screen" class="screen">
        <h1 id="leaderboard-title">歌曲排行榜</h1>
        <div id="name-prompt" style="display: none;">
            <h3>恭喜創下新紀錄！請留下你的大名 (3個字母)：</h3>
            <input type="text" id="player-name-input" maxlength="3" value="AAA">
            <button id="submit-score-btn" class="retro-button">提交分數</button>
        </div>
        <ol id="leaderboard-list"></ol>
        <button class="retro-button" id="back-from-leaderboard-btn">返回</button>
    </div>
    
    <div id="poster-preview-container">
        <canvas id="poster-canvas"></canvas>
    </div>

    <audio id="game-audio" preload="auto"></audio>

    <script>
    // =================================================================================
    //  時光迴廊 H5 遊戲 - 統一程式碼框架 v2.3
    // =================================================================================

    // --- 1. 全局 DOM 獲取與狀態管理 ---
    const allScreens = document.querySelectorAll('.screen');
    const gameUIs = document.querySelectorAll('.game-ui-container');
    const gameStatsEl = document.querySelector('.game-stats');
    const gameAudio = document.getElementById('game-audio');

    const Game = {
        state: {
            activeGame: null, currentSongId: null, score: 0, combo: 0, maxCombo: 0,
            hits: { perfect: 0, good: 0, miss: 0 }, totalNotes: 0, accuracy: 0, rating: 'C',
            isPlaying: false,
            isFirstPlay: { conductor: true, turntable: true, timebeat: true },
            startTime: null, animationFrameId: null,
        },
        init() {
            try {
                const firstPlayData = localStorage.getItem('isFirstPlay');
                if (firstPlayData) this.state.isFirstPlay = JSON.parse(firstPlayData);
            } catch (e) { console.error("讀取本地存檔失敗:", e); }

            document.querySelectorAll('.game-choice-card').forEach(card => card.addEventListener('click', () => {
                this.state.activeGame = card.dataset.gametype;
                this.showScreen('song-selection-screen');
                SongSelection.render();
            }));
            document.getElementById('back-to-main-menu-btn').addEventListener('click', () => this.showScreen('main-menu-screen'));
            document.getElementById('show-tutorial-btn').addEventListener('click', () => { this.showScreen('tutorial-screen'); Tutorial.start(); });
            document.getElementById('skip-tutorial-btn').addEventListener('click', () => { Tutorial.stop(); this.showScreen('main-menu-screen'); });
            document.getElementById('retry-button').addEventListener('click', () => this.startGame(this.state.currentSongId));
            document.getElementById('back-to-song-menu-btn').addEventListener('click', () => { this.showScreen('song-selection-screen'); SongSelection.render(); });
            document.getElementById('view-leaderboard-btn').addEventListener('click', () => Leaderboard.show());
            document.getElementById('poster-button').addEventListener('click', () => this.generatePoster());

            Leaderboard.init();
            this.showScreen('main-menu-screen');
        },
        showScreen(screenId) {
            allScreens.forEach(s => s.classList.remove('active'));
            const activeScreen = document.getElementById(screenId);
            if (activeScreen) activeScreen.classList.add('active');
        },
        startGame(songId) {
            if (this.state.isFirstPlay[this.state.activeGame]) {
                this.showFirstPlayHint();
                this.state.isFirstPlay[this.state.activeGame] = false;
                try { localStorage.setItem('isFirstPlay', JSON.stringify(this.state.isFirstPlay)); } catch (e) { console.error("儲存本地進度失敗:", e); }
            }

            Object.assign(this.state, {
                currentSongId: songId, score: 0, combo: 0, maxCombo: 0,
                hits: { perfect: 0, good: 0, miss: 0 }, isPlaying: true, startTime: null,
            });
            if(this.state.animationFrameId) cancelAnimationFrame(this.state.animationFrameId);

            allScreens.forEach(s => s.classList.remove('active'));
            gameUIs.forEach(ui => ui.classList.remove('active'));
            document.getElementById(`${this.state.activeGame}-game-area`).classList.add('active');
            gameStatsEl.style.display = 'flex';
            document.getElementById('score').textContent = 0;
            document.getElementById('combo').textContent = 0;

            const songData = SongData[this.state.activeGame][songId];
            gameAudio.src = songData.audioSrc;
            gameAudio.currentTime = 0;

            const gameModule = { timebeat: TimeBeat, conductor: Conductor, turntable: Turntable }[this.state.activeGame];
            if (gameModule) gameModule.start();
        },
        endGame() { /* ...程式碼不變... */ },
        showFirstPlayHint() { /* ...程式碼不變... */ },
        generatePoster() { /* ...程式碼不變... */ }
    };
    
    // --- 2. 歌曲數據 (程式碼不變) ---
    const SongData = { /* ... */ };
    const SongOrder = { /* ... */ };
    
    // --- 3. 排行榜 & 歌曲選擇 (程式碼不變) ---
    const Leaderboard = { /* ... */ };
    const SongSelection = { /* ... */ };

    // --- 4. 遊戲邏輯模組 ---
    const TimeBeat = {
        // ... 此處應包含完整的 TimeBeat 物件邏輯，與上一版相同 ...
        // ... 為節省篇幅，此處省略 ...
    };

    const Conductor = {
        start() {
             alert("《指揮家》遊戲模式正在銳意開發中，敬請期待！");
             Game.showScreen('song-selection-screen');
        },
    };

    const Turntable = {
        start() {
             alert("《時光唱盤》遊戲模式正在銳意開發中，敬請期待！");
             Game.showScreen('song-selection-screen');
        },
    };
    
    // --- 5. 教學模組 (全新實現) ---
    const Tutorial = {
        container: document.querySelector('#tutorial-screen .tutorial-container'),
        timer: null,
        step: 0,
        
        start() {
            this.step = 0;
            this.runStep();
            this.timer = setInterval(this.runStep.bind(this), 5000);
        },
        stop() {
            if (this.timer) clearInterval(this.timer);
            this.container.innerHTML = '';
        },
        runStep() {
            this.container.innerHTML = '';
            const demos = [this.demoTimeBeat, this.demoConductor, this.demoTurntable];
            demos[this.step % demos.length].call(this);
            this.step++;
        },
        demoTimeBeat() {
            const item = this.createItemWithText('<b>時光節拍:</b> 當音符到達判定線時，點擊對應軌道！');
            item.innerHTML += `
                <div class="demo-judgement-line"></div>
                <div class="demo-track" style="left: calc(25% - 1px);"></div>
                <div class="demo-track" style="left: calc(50% - 1px);"></div>
                <div class="demo-track" style="left: calc(75% - 1px);"></div>
                <div class="demo-note" style="left: 50%; animation: note-fall 2s linear forwards;"></div>
                <div class="demo-finger" style="left: 50%; top: 88%; animation: finger-tap 2s linear forwards;"></div>
            `;
            this.container.appendChild(item);
        },
        demoConductor() {
            const item = this.createItemWithText('<b>指揮家 (概念):</b> 在音符消失前，快速點擊它！');
            const noteX = 30 + Math.random() * 40 + '%';
            const noteY = 20 + Math.random() * 40 + '%';
            item.innerHTML += `
                <div class="demo-note" style="background: gold; box-shadow: 0 0 15px gold; left: ${noteX}; top: ${noteY}; animation: random-note-appear 4s ease-in-out forwards;"></div>
                <div class="demo-finger" style="left: ${noteX}; top: ${noteY}; animation: finger-tap 4s ease-in-out forwards; animation-delay: 0.5s;"></div>
            `;
            this.container.appendChild(item);
        },
        demoTurntable() {
            const item = this.createItemWithText('<b>時光唱盤 (概念):</b> 當音符旋轉到唱針位置時，按下按鈕！');
            item.innerHTML += `
                <div style="position: absolute; top: 50%; left: 50%; width: 200px; height: 200px; margin: -120px 0 0 -100px; animation: record-spin 5s linear infinite;">
                    <div style="position: relative; width: 100%; height: 100%; background: #333; border-radius: 50%; border: 10px solid #555;">
                        <div class="demo-note" style="background: orangered; box-shadow: 0 0 15px orangered; width: 20px; height: 20px; top: 10px; left: 50%;"></div>
                    </div>
                </div>
                <div style="position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; margin: -115px 0 0 -5px; background: white; border-radius: 50%;"></div>
            `;
            this.container.appendChild(item);
        },
        createItemWithText(text) {
            const item = document.createElement('div');
            item.className = 'tutorial-item active';
            const textEl = document.createElement('div');
            textEl.className = 'tutorial-text';
            textEl.innerHTML = text;
            item.appendChild(textEl);
            return item;
        }
    };
    
    // --- 6. 最終初始化 ---
    // 確保所有物件都已定義
    // (將上一版省略的物件程式碼補充於此)
    Game.init();

    </script>
</body>
</html>
