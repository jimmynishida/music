<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>時光迴廊 - 懷舊音樂之旅</title>
    <style>
        /* --- 全局與佈局 (樣式不變) --- */
        :root { /* ... */ }
        body, html { /* ... */ }
        .screen { /* ... */ }
        /* ... 其他通用樣式 ... */

        /* --- 指揮家遊戲區域專用樣式 --- */
        #conductor-game-area {
            cursor: crosshair;
        }
        #conductor-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="main-container">
        <div id="conductor-game-area" class="game-ui-container">
             <div class="game-background"></div>
             <canvas id="conductor-canvas"></canvas>
        </div>
        <div id="turntable-game-area" class="game-ui-container"> </div>
        <div id="timebeat-game-area" class="game-ui-container"> </div>
        <div class="game-stats" style="display: none;"> </div>
    </div>

    <div id="main-menu-screen" class="screen active"> </div>
    <div id="tutorial-screen" class="screen"> </div>
    <div id="song-selection-screen" class="screen"> </div>
    <div id="end-screen" class="screen"> </div>
    <div id="leaderboard-screen" class="screen"> </div>
    <div id="poster-preview-container"> </div>

    <audio id="game-audio" preload="auto"></audio>

    <script>
    // =================================================================================
    //  時光迴廊 H5 遊戲 - 統一程式碼框架 v2.4
    // =================================================================================

    // --- 1. 全局 DOM 獲取與狀態管理 (程式碼不變) ---
    // ... Game 物件 ...

    // --- 2. 歌曲數據 (更新指揮家模式) ---
    const SongData = {
        timebeat: { /* ...時光節拍歌曲... */ },
        conductor: {
            song1: { 
                title: '滄海一聲笑', 
                artist: '許冠傑', 
                unlockScore: 0, 
                duration: 22000, 
                audioSrc: 'https://cdn.jsdelivr.net/gh/c-at/music-box@main/audio/滄海一聲笑.mp3', 
                backgroundSrc: 'https://source.unsplash.com/random/800x600/?sea,boat,retro',
                // 新的譜面數據
                notes: [
                    { type: 'tap', time: 1500, pos: { x: 50, y: 50 } },
                    { type: 'tap', time: 2500, pos: { x: 30, y: 40 } },
                    { type: 'tap', time: 3500, pos: { x: 70, y: 60 } },
                    { 
                      type: 'slide', 
                      time: 5000, duration: 2500, 
                      startPos:   { x: 20, y: 80 }, 
                      controlPos: { x: 50, y: 20 }, // 曲線的控制點
                      endPos:     { x: 80, y: 80 }
                    },
                    { type: 'tap', time: 8000, pos: { x: 50, y: 50 } },
                    { 
                      type: 'slide', 
                      time: 9500, duration: 3000, 
                      startPos:   { x: 80, y: 20 }, 
                      controlPos: { x: 10, y: 50 },
                      endPos:     { x: 80, y: 80 }
                    },
                    { type: 'tap', time: 13000, pos: { x: 20, y: 20 } },
                    { type: 'tap', time: 13500, pos: { x: 80, y: 20 } },
                    { type: 'tap', time: 14000, pos: { x: 50, y: 50 } },
                ] 
            }
        },
        turntable: { /* ...時光唱盤歌曲... */ }
    };
    // ... SongOrder 物件更新 ...

    // --- 3. 排行榜 & 歌曲選擇 (程式碼不變) ---
    // ... Leaderboard, SongSelection 物件 ...
    
    // --- 4. 遊戲邏輯模組 ---
    // ... TimeBeat, Turntable 物件 ...

    // ===============================================
    //  指揮家 (Conductor) 遊戲邏輯 - 全新實現
    // ===============================================
    const Conductor = {
        canvas: null,
        ctx: null,
        beatmap: [],
        activeNotes: [],
        heldNote: null, // 當前按住的滑奏音符
        pointer: { x: 0, y: 0, isDown: false },
        
        // 初始化遊戲
        start() {
            this.canvas = document.getElementById('conductor-canvas');
            this.ctx = this.canvas.getContext('2d');
            this.resizeCanvas();
            window.addEventListener('resize', this.resizeCanvas.bind(this));

            // 綁定事件監聽
            this.canvas.addEventListener('pointerdown', this.onPointerDown.bind(this));
            window.addEventListener('pointermove', this.onPointerMove.bind(this)); // 監聽全局移動
            window.addEventListener('pointerup', this.onPointerUp.bind(this));

            const songData = SongData.conductor[Game.state.currentSongId];
            this.beatmap = JSON.parse(JSON.stringify(songData.notes)); // 深拷貝譜面
            Game.state.totalNotes = this.beatmap.length;
            this.activeNotes = [];
            this.heldNote = null;

            // 延遲開始以同步音訊
            setTimeout(() => {
                const playPromise = gameAudio.play();
                if (playPromise !== undefined) {
                    playPromise.catch(e => {
                        alert("音訊播放失敗，遊戲可能在無聲下進行。");
                        console.warn("音訊播放失敗", e);
                    }).finally(() => {
                        Game.state.startTime = performance.now();
                        Game.state.animationFrameId = requestAnimationFrame(this.gameLoop.bind(this));
                    });
                }
            }, 1500);
        },

        // 主遊戲循環
        gameLoop() {
            if (!Game.state.isPlaying) return;
            this.update();
            this.draw();
            Game.state.animationFrameId = requestAnimationFrame(this.gameLoop.bind(this));
        },

        // 更新遊戲狀態
        update() {
            const elapsedTime = performance.now() - Game.state.startTime;
            const songDuration = SongData.conductor[Game.state.currentSongId].duration;

            // 生成新音符
            if (this.beatmap.length > 0 && this.beatmap[0].time < elapsedTime + 2000) {
                this.activeNotes.push(this.beatmap.shift());
            }

            // 更新並移除過時音符
            this.activeNotes = this.activeNotes.filter(note => {
                if (note.type === 'tap' && elapsedTime > note.time + 500) { // 錯過Tap音符
                    Game.state.hits.miss++;
                    return false;
                }
                if (note.type === 'slide' && elapsedTime > note.time + note.duration + 500) { // 錯過Slide音符
                    if (!note.isHit) Game.state.hits.miss++;
                    return false;
                }
                return true;
            });

            // 處理滑奏音符的跟隨邏輯
            if (this.heldNote) {
                const note = this.heldNote;
                const followerPos = this.getFollowerPosition(note, elapsedTime);
                const dist = Math.hypot(this.pointer.x - followerPos.x, this.pointer.y - followerPos.y);
                if (dist > 80) { // 手指偏離軌道太遠
                    this.heldNote = null; // 斷開
                    Game.state.combo = 0;
                    document.getElementById('combo').textContent = Game.state.combo;
                }
            }

            // 遊戲結束判斷
            if (elapsedTime > songDuration && this.activeNotes.length === 0) {
                Game.endGame();
            }
        },

        // 繪製遊戲畫面
        draw() {
            this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
            const elapsedTime = performance.now() - Game.state.startTime;
            
            this.activeNotes.forEach(note => {
                const p = this.posToCanvas(note.pos || note.startPos);
                if (note.type === 'tap') {
                    // 繪製Tap音符和接近圈
                    const approachTime = Math.max(0, (note.time - elapsedTime) / 1000);
                    this.ctx.globalAlpha = note.isHit ? 0 : 1;
                    this.ctx.fillStyle = '#FFD700';
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, 30, 0, Math.PI * 2);
                    this.ctx.fill();

                    this.ctx.strokeStyle = '#FFFFFF';
                    this.ctx.lineWidth = 4;
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, 30 + approachTime * 50, 0, Math.PI * 2);
                    this.ctx.stroke();
                } 
                else if (note.type === 'slide') {
                    // 繪製滑奏軌跡 (貝茲曲線)
                    const start = this.posToCanvas(note.startPos);
                    const control = this.posToCanvas(note.controlPos);
                    const end = this.posToCanvas(note.endPos);
                    this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                    this.ctx.lineWidth = 10;
                    this.ctx.beginPath();
                    this.ctx.moveTo(start.x, start.y);
                    this.ctx.quadraticCurveTo(control.x, control.y, end.x, end.y);
                    this.ctx.stroke();
                    
                    // 繪製起點和終點
                    this.ctx.fillStyle = '#1E90FF';
                    [start, end].forEach(point => {
                        this.ctx.beginPath();
                        this.ctx.arc(point.x, point.y, 30, 0, Math.PI * 2);
                        this.ctx.fill();
                    });

                    // 繪製跟隨球
                    if (elapsedTime >= note.time) {
                        const followerPos = this.getFollowerPosition(note, elapsedTime);
                        this.ctx.fillStyle = this.heldNote === note ? '#FFD700' : 'white';
                        this.ctx.beginPath();
                        this.ctx.arc(followerPos.x, followerPos.y, 40, 0, Math.PI * 2);
                        this.ctx.fill();
                    }
                }
                this.ctx.globalAlpha = 1;
            });
        },
        
        // --- 輸入處理 ---
        onPointerDown(e) {
            this.pointer.isDown = true;
            this.updatePointerPos(e);
            const elapsedTime = performance.now() - Game.state.startTime;

            for (let i = this.activeNotes.length - 1; i >= 0; i--) {
                const note = this.activeNotes[i];
                const notePos = this.posToCanvas(note.pos || note.startPos);
                const dist = Math.hypot(this.pointer.x - notePos.x, this.pointer.y - notePos.y);

                if (dist < 60) { // 點擊半徑
                    if (note.type === 'tap' && Math.abs(elapsedTime - note.time) < 300) {
                        this.hit(note);
                        return; // 處理完畢
                    }
                    if (note.type === 'slide' && elapsedTime >= note.time && elapsedTime < note.time + 500) {
                        this.heldNote = note;
                        return; // 處理完畢
                    }
                }
            }
        },
        onPointerMove(e) {
            if (this.pointer.isDown) this.updatePointerPos(e);
        },
        onPointerUp(e) {
            this.pointer.isDown = false;
            const elapsedTime = performance.now() - Game.state.startTime;
            if (this.heldNote) {
                const note = this.heldNote;
                // 判斷是否在滑奏結束時鬆手
                if (elapsedTime >= note.time + note.duration - 300) {
                    this.hit(note);
                }
                this.heldNote = null;
            }
        },
        
        // --- 輔助函數 ---
        hit(note) {
            note.isHit = true; // 標記為已擊中
            Game.state.score += 100;
            Game.state.combo++;
            Game.state.maxCombo = Math.max(Game.state.maxCombo, Game.state.combo);
            Game.state.hits.perfect++;
            document.getElementById('score').textContent = Game.state.score;
            document.getElementById('combo').textContent = Game.state.combo;
            
            // 簡單移除效果，後續可加動畫
            this.activeNotes = this.activeNotes.filter(n => n !== note);
        },
        getFollowerPosition(note, elapsedTime) {
            const progress = Math.min(1, Math.max(0, (elapsedTime - note.time) / note.duration));
            return this.getBezierPoint(progress, this.posToCanvas(note.startPos), this.posToCanvas(note.controlPos), this.posToCanvas(note.endPos));
        },
        getBezierPoint(t, p0, p1, p2) {
            const x = Math.pow(1 - t, 2) * p0.x + 2 * (1 - t) * t * p1.x + Math.pow(t, 2) * p2.x;
            const y = Math.pow(1 - t, 2) * p0.y + 2 * (1 - t) * t * p1.y + Math.pow(t, 2) * p2.y;
            return { x, y };
        },
        updatePointerPos(e) {
            const rect = this.canvas.getBoundingClientRect();
            this.pointer.x = e.clientX - rect.left;
            this.pointer.y = e.clientY - rect.top;
        },
        posToCanvas(pos) { // 將百分比座標轉換為畫布像素座標
            return { x: pos.x / 100 * this.canvas.width, y: pos.y / 100 * this.canvas.height };
        },
        resizeCanvas() {
            this.canvas.width = this.canvas.offsetWidth;
            this.canvas.height = this.canvas.offsetHeight;
        }
    };

    // --- 5. 教學模組 (程式碼不變) ---
    // ... Tutorial 物件 ...
    
    // --- 6. 最終初始化 ---
    // (將所有物件的程式碼補充於此，為節省篇幅省略)
    Game.init();
    </script>
</body>
</html>
