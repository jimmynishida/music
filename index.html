<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>時光迴廊 - 懷舊音樂之旅</title>
    <style>
        /* --- 全局與佈局 --- */
        :root {
            --theme-color-1: #ff8c00; /* 溫暖的橙色 */
            --font-family: 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: var(--font-family);
            overflow: hidden;
            touch-action: none;
            background: linear-gradient(135deg, #2a2a3e, #4a3a4a);
            color: white;
            user-select: none;
            -webkit-user-select: none;
        }
        .screen {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            text-align: center;
            transition: opacity 0.5s ease;
            box-sizing: border-box;
            padding: 20px;
        }
        .screen.active { display: flex; }
        h1 { font-size: clamp(2.5rem, 10vw, 3.5rem); text-shadow: 2px 2px 8px rgba(0,0,0,0.8); }

        /* --- 手機版優化：按鈕樣式 --- */
        .retro-button {
            padding: 14px 28px;
            font-size: clamp(1rem, 4.5vw, 1.2rem);
            color: white;
            background: linear-gradient(145deg, var(--theme-color-1), #e06a00);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            cursor: pointer;
            margin: 10px;
            min-width: 150px;
            box-shadow: 0 4px 0 #a04a00, 2px 2px 8px rgba(0,0,0,0.5);
            transition: all 0.1s ease-out;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.7);
        }
        .retro-button:active { transform: translateY(2px); box-shadow: 0 2px 0 #a04a00; }
        
        /* --- 主選單 --- */
        #main-menu-screen { background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://source.unsplash.com/random/800x600/?80s,retro,city') no-repeat center center/cover; }
        .game-choice-container { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; margin-top: 20px; }
        .game-choice-card {
            width: clamp(130px, 35vw, 160px);
            height: clamp(180px, 48vw, 220px);
            margin: 10px;
            border: 3px solid rgba(255, 255, 255, 0.7); border-radius: 12px;
            background: rgba(0,0,0,0.4);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            cursor: pointer; transition: all 0.3s ease;
        }
        .game-choice-card:hover { transform: scale(1.05); border-color: var(--theme-color-1); }
        .game-choice-card .icon { font-size: clamp(3rem, 15vw, 4rem); }
        .game-choice-card .title { font-size: clamp(1.2rem, 5vw, 1.5rem); margin-top: 15px; font-weight: bold; }

        /* --- 玩法示範教學 --- */
        #tutorial-screen .tutorial-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 60vh;
            max-height: 500px;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid var(--theme-color-1);
            border-radius: 15px;
            overflow: hidden;
        }
        #tutorial-screen h2 { font-size: clamp(1.5rem, 6vw, 2rem); margin: 15px 0; color: var(--theme-color-1); text-shadow: 1px 1px 2px #000; }
        .tutorial-item { position: absolute; width: 100%; height: 100%; opacity: 0; transition: opacity 0.8s ease-in-out; }
        .tutorial-item.active { opacity: 1; }
        .tutorial-text { position: absolute; bottom: 10px; left: 0; width: 100%; font-size: clamp(0.9rem, 4vw, 1.1rem); background: rgba(0,0,0,0.5); padding: 8px 0; }
        
        /* 教學動畫元素 */
        .demo-judgement-line { position: absolute; bottom: 25%; left: 10%; width: 80%; height: 8px; background: gold; border-radius: 4px; box-shadow: 0 0 10px gold; }
        .demo-track { position: absolute; bottom: 25%; width: 2px; height: 65%; background: rgba(255,255,255,0.3); }
        .demo-note { position: absolute; width: 40px; height: 40px; background: cyan; border-radius: 50%; box-shadow: 0 0 15px cyan; transform: translateX(-50%); }
        .demo-finger {
            width: 50px; height: 50px; background: rgba(255,255,255,0.7); border-radius: 50%;
            position: absolute; box-shadow: 0 0 15px white; border: 2px solid white;
            transform: translate(-50%, -50%); opacity: 0;
        }
        
        /* 教學動畫 Keyframes */
        @keyframes note-fall { from { top: 10%; } to { top: 75%; } }
        @keyframes finger-tap {
            0%, 100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
            10% { opacity: 1; }
            50% { transform: translate(-50%, -50%) scale(0.9); }
            90% { opacity: 1; }
        }
        @keyframes random-note-appear {
             0%, 100% { opacity: 0; transform: scale(0.5); }
             10%, 90% { opacity: 1; transform: scale(1); }
        }
        @keyframes record-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* --- 其他畫面 --- */
        #song-selection-screen { /* ...樣式不變... */ }
        #end-screen { /* ...樣式不變... */ }

        /* 遊戲區域 */
        .game-ui-container.active { display: block; }
        .game-background { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; transition: filter 0.5s ease-out; z-index: -1; }
        #timebeat-game-area canvas { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; }

    </style>
</head>
<body>

    <div id="main-menu-screen" class="screen active"> </div>

    <div id="tutorial-screen" class="screen">
        <h2>玩法示範</h2>
        <div class="tutorial-container">
             </div>
        <button class="retro-button" id="skip-tutorial-btn">返回主選單</button>
    </div>
    
    <div id="song-selection-screen" class="screen"> </div>
    <div id="end-screen" class="screen"> </div>
    <div id="leaderboard-screen" class="screen"> </div>
    <div id="poster-preview-container"> </div>
    <div id="main-container"> </div>
    <audio id="game-audio" preload="auto"></audio>

    <script>
    // =================================================================================
    //  時光迴廊 H5 遊戲 - 統一程式碼框架 v2.2
    // =================================================================================

    // --- 1. 全局 DOM 獲取與狀態管理 (程式碼不變) ---
    // ... Game, SongData, Leaderboard, SongSelection 等物件 ...
    
    // --- 5. 教學模組 (全新實現) ---
    const Tutorial = {
        container: document.querySelector('#tutorial-screen .tutorial-container'),
        timer: null,
        step: 0,
        
        start() {
            this.step = 0;
            this.runStep(); // 立即執行第一個
            this.timer = setInterval(this.runStep.bind(this), 5000); // 每5秒切換
        },
        
        stop() {
            clearInterval(this.timer);
            this.container.innerHTML = ''; // 清空內容
        },
        
        runStep() {
            this.container.innerHTML = ''; // 清空上一步的動畫
            const demos = [this.demoTimeBeat, this.demoConductor, this.demoTurntable];
            demos[this.step % demos.length].call(this);
            this.step++;
        },
        
        // 教學一：時光節拍
        demoTimeBeat() {
            const fragment = document.createDocumentFragment();
            const item = document.createElement('div');
            item.className = 'tutorial-item active';

            // 創建場景：判定線和軌道
            const line = document.createElement('div');
            line.className = 'demo-judgement-line';
            item.appendChild(line);

            ['25%', '50%', '75%'].forEach(left => {
                const track = document.createElement('div');
                track.className = 'demo-track';
                track.style.left = `calc(${left} - 1px)`;
                item.appendChild(track);
            });

            // 創建下落的音符
            const note = document.createElement('div');
            note.className = 'demo-note';
            note.style.left = '50%'; // 中間軌道
            note.style.animation = 'note-fall 2s linear forwards';
            item.appendChild(note);

            // 創建模擬手指
            const finger = document.createElement('div');
            finger.className = 'demo-finger';
            finger.style.left = '50%'; // 中間軌道
            finger.style.top = '88%'; // 判定區下方
            finger.style.animation = 'finger-tap 2s linear forwards';
            item.appendChild(finger);
            
            // 創建說明文字
            const text = document.createElement('div');
            text.className = 'tutorial-text';
            text.innerHTML = '<b>時光節拍:</b> 當音符到達判定線時，點擊對應軌道！';
            item.appendChild(text);

            fragment.appendChild(item);
            this.container.appendChild(fragment);
        },

        // 教學二：指揮家 (概念)
        demoConductor() {
            const fragment = document.createDocumentFragment();
            const item = document.createElement('div');
            item.className = 'tutorial-item active';

            // 創建隨機音符
            const note = document.createElement('div');
            note.className = 'demo-note';
            note.style.background = 'gold';
            note.style.boxShadow = '0 0 15px gold';
            const noteX = 30 + Math.random() * 40 + '%';
            const noteY = 20 + Math.random() * 40 + '%';
            note.style.left = noteX;
            note.style.top = noteY;
            note.style.animation = 'random-note-appear 4s ease-in-out forwards';
            item.appendChild(note);

            // 創建模擬手指
            const finger = document.createElement('div');
            finger.className = 'demo-finger';
            finger.style.left = noteX;
            finger.style.top = noteY;
            finger.style.animation = 'finger-tap 4s ease-in-out forwards';
            finger.style.animationDelay = '0.5s';
            item.appendChild(finger);
            
            // 創建說明文字
            const text = document.createElement('div');
            text.className = 'tutorial-text';
            text.innerHTML = '<b>指揮家 (概念):</b> 在音符消失前，快速點擊它！';
            item.appendChild(text);

            fragment.appendChild(item);
            this.container.appendChild(fragment);
        },

        // 教學三：時光唱盤 (概念)
        demoTurntable() {
            const fragment = document.createDocumentFragment();
            const item = document.createElement('div');
            item.className = 'tutorial-item active';

            // 創建唱片
            const record = document.createElement('div');
            record.style.cssText = `
                position: absolute; top: 50%; left: 50%;
                width: 200px; height: 200px; margin: -120px 0 0 -100px;
                background: #333; border-radius: 50%;
                border: 10px solid #555;
                animation: record-spin 5s linear infinite;
            `;
            item.appendChild(record);

            // 創建唱片上的音符
            const note = document.createElement('div');
            note.className = 'demo-note';
            note.style.background = 'orangered';
            note.style.boxShadow = '0 0 15px orangered';
            note.style.width = '20px'; note.style.height = '20px';
            note.style.top = '10px'; // 放在唱片頂部
            note.style.left = '50%';
            record.appendChild(note);

            // 創建唱針 (判定線)
            const stylus = document.createElement('div');
            stylus.style.cssText = `
                position: absolute; top: 50%; left: 50%;
                width: 10px; height: 10px; margin: -115px 0 0 -5px;
                background: white; border-radius: 50%;
            `;
            item.appendChild(stylus);

            // 創建說明文字
            const text = document.createElement('div');
            text.className = 'tutorial-text';
            text.innerHTML = '<b>時光唱盤 (概念):</b> 當音符旋轉到唱針位置時，按下按鈕！';
            item.appendChild(text);
            
            fragment.appendChild(item);
            this.container.appendChild(fragment);
        }
    };
    
    // --- 6. 最終初始化 ---
    // Game.init() 會在所有物件都定義完畢後執行
    // ...
    // ... 所有其他物件的完整程式碼，如 Game, SongData, TimeBeat 等 ...
    // ... (為節省篇幅，此處省略與上一版相同的程式碼) ...
    // ...
    Game.init(); // 確保這是腳本的最後一步

    </script>
</body>
</html>
