<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>時光迴廊 - 懷舊音樂之旅</title>
    <style>
        :root { --theme-color-1: #ff8c00; --font-family: 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: var(--font-family); overflow: hidden; touch-action: manipulation; background: linear-gradient(135deg, #2a2a3e, #4a3a4a); color: white; user-select: none; -webkit-user-select: none; }
        .screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; justify-content: center; align-items: center; background-color: rgba(0, 0, 0, 0.5); backdrop-filter: blur(5px); text-align: center; transition: opacity 0.5s ease; box-sizing: border-box; padding: 20px; z-index: 200; }
        .screen.active { display: flex; }
        h1, h2, h3 { text-shadow: 2px 2px 8px rgba(0,0,0,0.8); }
        h1 { font-size: clamp(2.5rem, 10vw, 3.5rem); }
        h2 { font-size: clamp(1.8rem, 8vw, 2.5rem); margin-bottom: 20px;}
        .retro-button { padding: 14px 28px; font-size: clamp(1rem, 4.5vw, 1.2rem); color: white; background: linear-gradient(145deg, var(--theme-color-1), #e06a00); border: 2px solid rgba(255, 255, 255, 0.5); border-radius: 12px; cursor: pointer; margin: 10px; min-width: 150px; box-shadow: 0 4px 0 #a04a00, 2px 2px 8px rgba(0,0,0,0.5); transition: all 0.1s ease-out; text-shadow: 1px 1px 2px rgba(0,0,0,0.7); }
        .retro-button:active { transform: translateY(2px); box-shadow: 0 2px 0 #a04a00; }
        .top-stats-bar { position: fixed; top: 20px; left: 0; right: 0; display: flex; justify-content: space-between; z-index: 100; pointer-events: none; padding: 0 20px; box-sizing: border-box; }
        .stats-display { background-color: rgba(0, 0, 0, 0.5); padding: 8px 15px; border-radius: 20px; font-size: clamp(1rem, 5vw, 1.3rem); font-weight: bold; border: 1px solid; pointer-events: auto; }
        .star-display { color: gold; border-color: gold; }
        .wallet-display { color: #FFD700; border-color: #FFD700; }
        #main-menu-screen { background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://source.unsplash.com/random/800x600/?80s,retro,road') no-repeat center center/cover; justify-content: center; }
        .main-menu-buttons { display: flex; flex-direction: column; align-items: center; gap: 20px; margin-top: 40px; }
        .main-menu-buttons .retro-button { width: 280px; height: 70px; font-size: 1.8rem; }
        .retro-button.small { width: auto; height: auto; font-size: 1rem; padding: 10px 20px; position: absolute; bottom: 20px; right: 20px; z-index: 201;}
        .version-display { position: absolute; bottom: 10px; right: 10px; font-size: 12px; color: rgba(255,255,255,0.3); }
        #mode-selection-screen, #song-selection-screen, #profile-screen { justify-content: flex-start; padding-top: 80px; }
        .game-ui-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; pointer-events: none; }
        .game-ui-container.active { display: block; pointer-events: auto; }
        
        /* 個人中心樣式 */
        #profile-screen .profile-content { width: 100%; max-width: 500px; height: calc(100vh - 120px); display: flex; flex-direction: column; gap: 20px; }
        .profile-header { display: flex; align-items: center; gap: 20px; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 10px; }
        .profile-avatar { width: 80px; height: 80px; background: #555; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 40px;}
        .profile-info { text-align: left; }
        .profile-stats, .profile-achievements, .profile-settings { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 10px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 10px; }
        .stat-item { background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; }
        .stat-item .value { font-size: 1.8rem; font-weight: bold; }
        .achievements-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 15px; margin-top: 10px; max-height: 200px; overflow-y: auto; text-align: center;}
        .achievement-item { background: #333; padding: 10px; border-radius: 8px; opacity: 0.4; font-size: 0.7rem; }
        .achievement-item.unlocked { background: var(--theme-color-1); opacity: 1; }
        .achievement-item .icon { font-size: 2rem; }
        .settings-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        
        /* 海報與通知樣式 */
        #poster-preview-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 400; }
        #poster-canvas { border: 2px solid white; border-radius: 10px; max-width: 90%; max-height: 90%; }
        #toast-notification { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); background: linear-gradient(145deg, var(--theme-color-1), #e06a00); color: white; padding: 12px 25px; border-radius: 20px; z-index: 500; font-size: 1rem; opacity: 0; transition: opacity 0.5s, top 0.5s; pointer-events: none; }
        #toast-notification.show { opacity: 1; top: 100px; }

        /* (其他與 v16.2 相同的樣式) */
    </style>
</head>
<body>
    <div class="top-stats-bar"></div>
    <div id="main-menu-screen" class="screen active"></div>
    <div id="mode-selection-screen" class="screen"></div>
    <div id="song-selection-screen" class="screen"></div>
    <div id="end-screen" class="screen"></div>
    <div id="profile-screen" class="screen"></div>
    <div id="tutorial-screen" class="screen"></div>
    
    <div id="main-container">
        <div id="timebeat-game-area" class="game-ui-container"><canvas id="timebeat-canvas"></canvas></div>
        <div id="conductor-game-area" class="game-ui-container"></div>
        <div id="turntable-game-area" class="game-ui-container"></div>
        <div class="game-stats">
            <div>得分: <span id="score">0</span></div>
            <div>連擊: <span id="combo">0</span></div>
        </div>
    </div>

    <div id="poster-preview-container"></div>
    <div id="toast-notification"></div>
    <audio id="game-audio" preload="auto"></audio>
    <audio id="sfx-audio" preload="auto"></audio>

    <script>
    // =================================================================================
    //  時光迴廊 H5 遊戲 - v17.1 (結構修正穩定版)
    // =================================================================================
    document.addEventListener('DOMContentLoaded', () => {

        // [新增] 啟動檢查，確保HTML結構完整
        const requiredDivs = ['main-menu-screen', 'mode-selection-screen', 'song-selection-screen', 'end-screen', 'profile-screen', 'tutorial-screen', 'poster-preview-container', 'toast-notification'];
        const missingDiv = requiredDivs.find(id => !document.getElementById(id));
        if (missingDiv) {
            document.body.innerHTML = `<h1 style="color:red; font-family: sans-serif; text-align: center; padding-top: 50px;">Fatal Error: HTML element #${missingDiv} is missing.</h1>`;
            return; // 停止執行
        }

        // --- HTML 注入 ---
        document.querySelector('.top-stats-bar').innerHTML = `<div class="stats-display star-display">⭐ <span id="total-stars">0</span></div><div class="stats-display wallet-display">🪙 <span id="timecoin-balance">0</span></div>`;
        document.getElementById('main-menu-screen').innerHTML = `<h1>時光迴廊</h1><div class="main-menu-buttons"><button class="retro-button" id="start-free-play-btn">開始遊戲</button><button class="retro-button" id="start-challenge-hub-btn" style="opacity:0.5; cursor:not-allowed;">今日挑戰</button></div><button class="retro-button small" id="profile-btn">個人中心</button><div class="version-display">v17.1</div>`;
        document.getElementById('end-screen').innerHTML = `<div id="end-screen-content"><h2>演奏結束</h2><p id="end-title" style="font-size:1.2em; font-weight:bold;"></p><div id="result-stars-container"></div><p style="font-size: 24px;">最終得分: <span id="final-score">0</span></p><p>最高連擊: <span id="max-combo">0</span></p><p>準確率: <span id="accuracy">0%</span></p><p>獲得時光幣: <span id="result-coins">0</span></p><p style="font-size: 32px; font-weight: bold; color: gold;">評級: <span id="rating-badge"></span></p><div style="display:flex; justify-content:center;"><button class="retro-button" id="share-btn">分享戰績</button><button class="retro-button" id="retry-btn">再次嘗試</button></div><button class="retro-button" id="back-to-song-select-btn">返回選曲</button></div>`;
        document.getElementById('poster-preview-container').innerHTML = `<canvas id="poster-canvas"></canvas>`;
        // ... 其他與 v16.2 相同的注入 ...
        
        const allScreens = document.querySelectorAll('.screen');
        const gameAudio = document.getElementById('game-audio');
        const sfxAudio = document.getElementById('sfx-audio');

        // ... (SongData, EraData, Wallet, Leaderboard, SongSelection, Tutorial, Game Modules 與 v16.2 相同)

        // [新增] 成就系統模組
        const Achievements = {
            data: {
                first_play: { icon: '🎵', title: '初試啼聲', desc: '完成第一首歌曲', unlocked: false },
                s_rank: { icon: 'S', title: 'S級評價', desc: '首次獲得S評級', unlocked: false },
                combo_100: { icon: '🔥', title: '連擊狂人', desc: '最高連擊達到100', unlocked: false },
                perfect_100: { icon: '🎯', title: '節拍大師', desc: '累計獲得100次Perfect', unlocked: false },
                unlock_90s: { icon: '📼', title: '九零年代', desc: '解鎖90年代曲目', unlocked: false },
            },
            stats: {
                perfect_hits: 0,
            },
            init() {
                const savedData = JSON.parse(localStorage.getItem('achievements_data') || '{}');
                const savedStats = JSON.parse(localStorage.getItem('achievements_stats') || '{}');
                for (const key in this.data) { if (savedData[key]) this.data[key].unlocked = true; }
                this.stats.perfect_hits = savedStats.perfect_hits || 0;
            },
            checkAndUnlock(endGameData) {
                let newAchievements = [];
                // 更新統計數據
                this.stats.perfect_hits += endGameData.hits.perfect || 0;

                // 檢查成就
                if (!this.data.first_play.unlocked) { this.data.first_play.unlocked = true; newAchievements.push(this.data.first_play); }
                if (!this.data.s_rank.unlocked && endGameData.rating === 'S') { this.data.s_rank.unlocked = true; newAchievements.push(this.data.s_rank); }
                if (!this.data.combo_100.unlocked && endGameData.maxCombo >= 100) { this.data.combo_100.unlocked = true; newAchievements.push(this.data.combo_100); }
                if (!this.data.perfect_100.unlocked && this.stats.perfect_hits >= 100) { this.data.perfect_100.unlocked = true; newAchievements.push(this.data.perfect_100); }
                if (!this.data.unlock_90s.unlocked && endGameData.totalStars >= EraData['90s'].starsToUnlock) { this.data.unlock_90s.unlocked = true; newAchievements.push(this.data.unlock_90s); }

                if (newAchievements.length > 0) {
                    this.save();
                    newAchievements.forEach((ach, i) => setTimeout(() => UI.showToast(`成就解鎖：${ach.title}`), i * 500));
                } else { this.saveStats(); }
            },
            save() {
                const dataToSave = {};
                for (const key in this.data) { if(this.data[key].unlocked) dataToSave[key] = true; }
                localStorage.setItem('achievements_data', JSON.stringify(dataToSave));
                this.saveStats();
            },
            saveStats() {
                localStorage.setItem('achievements_stats', JSON.stringify(this.stats));
            }
        };

        // [新增] 個人中心模組
        const Profile = {
            init() {
                const profileBtn = document.getElementById('profile-btn');
                if (profileBtn) profileBtn.addEventListener('click', () => { this.render(); Game.showScreen('profile-screen'); });
            },
            render() {
                const screen = document.getElementById('profile-screen');
                const totalSongsCompleted = Object.keys(Leaderboard.playerProgress).filter(key => Leaderboard.playerProgress[key].score > 0).length;
                const maxCombo = Object.values(Leaderboard.playerProgress).reduce((max, song) => Math.max(max, song.maxCombo || 0), 0);

                screen.innerHTML = `
                    <div class="profile-content">
                        <div class="profile-header">
                            <div class="profile-avatar">👤</div>
                            <div class="profile-info">
                                <h2 style="margin:0;">懷舊玩家</h2>
                                <p>⭐ ${Leaderboard.getTotalStars()} | 🪙 ${Wallet.coins}</p>
                            </div>
                        </div>
                        <div class="profile-stats">
                            <h3>生涯統計</h3>
                            <div class="stats-grid">
                                <div class="stat-item"><div class="value">${maxCombo}</div><div>歷史最高連擊</div></div>
                                <div class="stat-item"><div class="value">${totalSongsCompleted}</div><div>總通關歌曲數</div></div>
                            </div>
                        </div>
                        <div class="profile-achievements">
                            <h3>成就殿堂</h3>
                            <div class="achievements-grid">
                                ${Object.values(Achievements.data).map(ach => `<div class="achievement-item ${ach.unlocked ? 'unlocked' : ''}" title="${ach.desc}"><div class="icon">${ach.icon}</div><div>${ach.title}</div></div>`).join('')}
                            </div>
                        </div>
                         <div class="profile-settings">
                            <h3>設定</h3>
                            <div class="settings-item"><span>背景音樂</span> <input type="range" id="bgm-volume" min="0" max="1" step="0.1" value="${gameAudio.volume}"></div>
                            <div class="settings-item"><span>遊戲音效</span> <input type="range" id="sfx-volume" min="0" max="1" step="0.1" value="${sfxAudio.volume}"></div>
                            <button class="retro-button" id="reset-tutorial-btn-profile" style="width:100%; margin-top:10px;">重設教學提示</button>
                        </div>
                        <button class="retro-button" id="back-to-main-from-profile-btn">返回主選單</button>
                    </div>`;

                document.getElementById('back-to-main-from-profile-btn').addEventListener('click', () => Game.showScreen('main-menu-screen'));
                document.getElementById('reset-tutorial-btn-profile').addEventListener('click', () => { localStorage.removeItem('tutorialShown'); alert('教學提示已重設！'); Tutorial.init(); });
                document.getElementById('bgm-volume').addEventListener('input', (e) => gameAudio.volume = e.target.value);
                document.getElementById('sfx-volume').addEventListener('input', (e) => sfxAudio.volume = e.target.value);
            }
        };

        // [新增] 海報生成模組
        const Poster = {
            generate(song, result) {
                const container = document.getElementById('poster-preview-container');
                const canvas = document.getElementById('poster-canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = 400; canvas.height = 600;
                
                ctx.fillStyle = '#1a1a3e'; ctx.fillRect(0,0,400,600);
                ctx.fillStyle = 'white'; ctx.textAlign = 'center';
                ctx.font = 'bold 32px sans-serif'; ctx.fillText(song.title, 200, 100);
                ctx.font = '20px sans-serif'; ctx.fillText(song.artist, 200, 140);
                ctx.font = '24px sans-serif'; ctx.fillText(`得分: ${result.score}`, 200, 250);
                ctx.fillText(`最高連擊: ${result.maxCombo}`, 200, 290);
                ctx.font = 'bold 60px sans-serif'; ctx.fillStyle = 'gold'; ctx.fillText(result.rating, 200, 400);
                ctx.font = 'italic 24px sans-serif'; ctx.fillStyle = 'cyan'; ctx.fillText('時光迴廊', 200, 500);
                ctx.font = '14px sans-serif'; ctx.fillStyle = 'lightgray'; ctx.fillText('長按圖片即可儲存分享', 200, 550);

                container.style.display = 'flex';
                container.addEventListener('click', () => container.style.display = 'none', {once: true});
            }
        };
        
        // [新增] UI模組，用於顯示通知
        const UI = {
            showToast(message) {
                const toast = document.getElementById('toast-notification');
                toast.textContent = message;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2500);
            }
        };
        
        const Game = {
            state: { /* ... */ },
            modules: { timebeat: TimeBeat, conductor: Conductor, turntable: Turntable },
            init() {
                Wallet.load(); Leaderboard.init(); Achievements.init(); Profile.init(); Tutorial.init();
                Object.values(this.modules).forEach(m => m.init?.());
                // ... (Event listeners for buttons) ...
                document.getElementById('start-free-play-btn').addEventListener('click', () => this.showScreen('mode-selection-screen'));
                // ... (The rest of the listeners are the same as v16.2)
            },
            // ... (showScreen, startGame, updateCombo, and the CORRECT handleHit are assumed to be here from v16.2 final logic)
            endGame() {
                if (!this.state.isPlaying) return;
                // ... (stop game, pause audio) ...
                
                const song = SongData[this.state.currentSongId];
                if (!song) { this.showScreen('mode-selection-screen'); return; }
                const totalNotes = song.notes?.length || 1;
                const totalHits = (this.state.hits.perfect || 0) + (this.state.hits.good || 0);
                const accuracy = totalNotes > 0 ? (totalHits / totalNotes) * 100 : 0;
                let rating = 'C', stars = 0;
                if (accuracy >= 98) { rating = 'S'; stars = 3; }
                else if (accuracy > 90) { rating = 'A'; stars = 2; }
                else if (accuracy > 70) { rating = 'B'; stars = 1; }
                const coinsEarned = stars * 10 + Math.floor(this.state.score / 1000);
                
                this.state.rating = rating;
                
                Leaderboard.updateSongProgress(this.state.currentSongId, this.state.activeGame, this.state.score, stars, this.state.maxCombo);
                Wallet.addCoins(coinsEarned);

                Achievements.checkAndUnlock({
                    rating: this.state.rating,
                    maxCombo: this.state.maxCombo,
                    hits: this.state.hits,
                    totalStars: Leaderboard.getTotalStars()
                });

                document.getElementById('end-title').textContent = song.title;
                document.getElementById('final-score').textContent = this.state.score;
                document.getElementById('max-combo').textContent = this.state.maxCombo;
                document.getElementById('accuracy').textContent = `${accuracy.toFixed(2)}%`;
                document.getElementById('rating-badge').textContent = rating;
                document.getElementById('result-coins').textContent = `+${coinsEarned}`;
                // ... (update stars UI) ...
                this.showScreen('end-screen');

                 // Bind end-screen buttons here to ensure they exist
                document.getElementById('share-btn').onclick = () => {
                    Wallet.addCoins(20);
                    UI.showToast('分享成功！獲得 🪙 20');
                    Poster.generate(song, { score: this.state.score, maxCombo: this.state.maxCombo, rating: this.state.rating });
                };
                document.getElementById('retry-btn').onclick = () => this.startGame(this.state.currentSongId);
                document.getElementById('back-to-song-select-btn').onclick = () => { this.showScreen('song-selection-screen'); SongSelection.render(); };
            }
        };
        
        // --- 啟動遊戲 ---
        Game.init();
        
        // The full script is too long to paste again. The above snippets show the NEW and MODIFIED modules.
        // All other modules (TimeBeat, Conductor, Turntable, Game.handleHit, etc.) should be taken from the
        // last known good version (v16.2's logic).
    });
    </script>
</body>
</html>
