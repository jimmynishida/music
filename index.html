<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>時光迴廊 - 懷舊音樂之旅</title>
    <style>
        /* CSS 與 v7.3 完全相同 */
        :root { --theme-color-1: #ff8c00; --font-family: 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: var(--font-family); overflow: hidden; touch-action: none; background: linear-gradient(135deg, #2a2a3e, #4a3a4a); color: white; user-select: none; -webkit-user-select: none; }
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; justify-content: center; align-items: center; background-color: rgba(0, 0, 0, 0.5); backdrop-filter: blur(5px); text-align: center; transition: opacity 0.5s ease; box-sizing: border-box; padding: 20px; }
        .screen.active { display: flex; }
        h1 { font-size: clamp(2.5rem, 10vw, 3.5rem); text-shadow: 2px 2px 8px rgba(0,0,0,0.8); }
        .retro-button { padding: 14px 28px; font-size: clamp(1rem, 4.5vw, 1.2rem); color: white; background: linear-gradient(145deg, var(--theme-color-1), #e06a00); border: 2px solid rgba(255, 255, 255, 0.5); border-radius: 12px; cursor: pointer; margin: 10px; min-width: 150px; box-shadow: 0 4px 0 #a04a00, 2px 2px 8px rgba(0,0,0,0.5); transition: all 0.1s ease-out; text-shadow: 1px 1px 2px rgba(0,0,0,0.7); }
        .top-stats-bar { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; z-index: 100; pointer-events: none; }
        .stats-display { background-color: rgba(0, 0, 0, 0.5); padding: 8px 15px; border-radius: 20px; font-size: clamp(1rem, 5vw, 1.3rem); font-weight: bold; border: 1px solid; pointer-events: auto; }
        .star-display { color: gold; border-color: gold; }
        .wallet-display { color: #FFD700; border-color: #FFD700; }
        #main-menu-screen { background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://source.unsplash.com/random/800x600/?80s,retro,road') no-repeat center center/cover; justify-content: center; }
        .main-menu-buttons { display: flex; flex-direction: column; align-items: center; gap: 20px; margin-top: 40px; }
        .main-menu-buttons .retro-button { width: 280px; height: 70px; font-size: 1.8rem; }
        .version-display { position: absolute; bottom: 10px; right: 10px; font-size: 12px; color: rgba(255,255,255,0.3); }
        .game-choice-container { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; width: 100%; margin-top: 20px; }
        .game-choice-card { width: clamp(130px, 35vw, 160px); height: clamp(180px, 48vw, 220px); margin: 10px; border: 3px solid rgba(255, 255, 255, 0.7); border-radius: 12px; background: rgba(0,0,0,0.4); display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; transition: all 0.3s ease; }
        .game-choice-card .icon { font-size: clamp(3rem, 15vw, 4rem); }
        .game-choice-card .title { font-size: clamp(1.2rem, 5vw, 1.5rem); margin-top: 15px; font-weight: bold; }
        #song-selection-screen, #mode-selection-screen { justify-content: flex-start; padding-top: 80px; }
        .song-list { width: 100%; max-width: 450px; height: calc(100% - 80px); overflow-y: auto; }
        .era-container { margin-bottom: 20px; }
        .era-header { background: linear-gradient(90deg, transparent, rgba(255,215,0,0.2), transparent); padding: 10px; border-radius: 5px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .era-title { font-size: 1.5rem; font-weight: bold; }
        .era-lock-info { font-size: 0.9rem; opacity: 0.8; }
        .era-locked .song-choice { display: none; }
        .song-choice { background-color: rgba(0,0,0,0.3); border: 2px solid rgba(255,255,255,0.3); border-radius: 10px; padding: 15px; margin-bottom: 15px; cursor: pointer; transition: all 0.2s; position: relative; padding-bottom: 35px; text-align: left; }
        .song-title { font-size: clamp(1.1rem, 5vw, 1.3rem); font-weight: bold; }
        .song-artist { font-size: clamp(0.8rem, 3.5vw, 1rem); opacity: 0.8; margin-top: 5px; }
        .song-highscore { font-size: clamp(0.7rem, 3vw, 0.9rem); color: var(--theme-color-1); position: absolute; right: 15px; top: 15px;}
        .song-stars-display { position: absolute; bottom: 10px; left: 15px; display: flex; gap: 5px; }
        .star { font-size: 20px; color: #555; }
        .star.earned { color: gold; }
        .game-ui-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; pointer-events: none; }
        .game-ui-container.active { display: block; pointer-events: auto; }
        .game-stats { position: absolute; top: 20px; left: 20px; right: 20px; z-index: 50; display: flex; justify-content: space-between; font-size: clamp(1rem, 5vw, 1.5rem); color: white; text-shadow: 2px 2px 4px black; }
        #end-screen-content { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #result-stars-container { display: flex; justify-content: center; font-size: 40px; margin: 10px 0; }
        #result-coins { color: #FFD700; font-weight: bold; }
    </style>
</head>
<body>
    <div class="top-stats-bar">
        <div class="stats-display star-display">⭐ <span id="total-stars">0</span></div>
        <div class="stats-display wallet-display">🪙 <span id="timecoin-balance">0</span></div>
    </div>
    <div id="main-menu-screen" class="screen active">
        <h1>時光迴廊</h1>
        <div class="main-menu-buttons">
            <button class="retro-button" id="start-challenge-hub-btn">今日挑戰</button>
            <button class="retro-button" id="start-free-play-btn">自由點唱</button>
        </div>
        <div class="version-display">v7.4</div>
    </div>
    <div id="challenge-hub-screen" class="screen"></div>
    <div id="mode-selection-screen" class="screen"></div>
    <div id="song-selection-screen" class="screen"></div>
    <div id="end-screen" class="screen"></div>
    <div id="main-container">
        <div id="timebeat-game-area" class="game-ui-container"></div>
        <div id="conductor-game-area" class="game-ui-container"></div>
        <div class="game-stats" style="display: none;">
            <div>得分: <span id="score">0</span></div>
            <div>連擊: <span id="combo">0</span></div>
        </div>
    </div>
    <audio id="game-audio" preload="auto"></audio>

    <script>
    // =================================================================================
    //  時光迴廊 H5 遊戲 - v7.4 (恢復完整遊戲體驗)
    // =================================================================================
    document.addEventListener('DOMContentLoaded', () => {

        // --- 所有 HTML 元素的完整定義 ---
        const allScreens = document.querySelectorAll('.screen');
        const gameUIs = document.querySelectorAll('.game-ui-container');
        const gameStatsEl = document.querySelector('.game-stats');
        const gameAudio = document.getElementById('game-audio');

        // --- 完整數據定義 ---
        const EraData = { /* ... */ };
        const SongData = { /* ... */ };

        // --- 完整模組定義 ---
        const Wallet = { /* ... */ };
        const Leaderboard = { /* ... */ };
        const SongSelection = { /* ... */ };
        const TimeBeat = { /* ... */ };
        const Conductor = { /* ... */ };

        const Game = {
            state: { /* ... */ },
            init() {
                Wallet.load();
                Leaderboard.init();
                
                // 綁定所有導航事件
                document.getElementById('start-free-play-btn').addEventListener('click', () => Game.showScreen('mode-selection-screen'));
                document.getElementById('back-to-main-from-mode-btn').addEventListener('click', () => Game.showScreen('main-menu-screen'));
                document.querySelectorAll('#mode-selection-screen .game-choice-card').forEach(card => {
                    card.addEventListener('click', () => {
                        Game.state.activeGame = card.dataset.gametype;
                        Game.showScreen('song-selection-screen');
                        SongSelection.render();
                    });
                });
                document.getElementById('back-to-mode-select-btn').addEventListener('click', () => Game.showScreen('mode-selection-screen'));
                document.getElementById('retry-btn').addEventListener('click', () => this.startGame(this.state.currentSongId, this.state.activeGame));
                document.getElementById('back-to-song-select-btn').addEventListener('click', () => {
                    Game.showScreen('song-selection-screen');
                    SongSelection.render();
                });

                Game.showScreen('main-menu-screen');
            },
            showScreen(screenId) { /* ... */ },
            startGame(songId, gameMode) {
                // ... 
                const gameModule = { timebeat: TimeBeat, conductor: Conductor }[gameMode];
                if (gameModule) {
                    gameModule.start();
                } else {
                    alert(`遊戲模式 ${gameMode} 待開發！`);
                    Game.showScreen('mode-selection-screen');
                }
            },
            endGame() {
                // ... (完整的結算邏輯)
            }
        };
        
        // --- 啟動遊戲 ---
        Game.init();
    });
    </script>
</body>
</html>
