<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>時光迴廊 - 懷舊音樂之旅</title>
    <style>
        /* CSS 樣式與上一版 v3.4 完全相同，此處為節省篇幅省略 */
        :root { --theme-color-1: #ff8c00; --font-family: 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: var(--font-family); overflow: hidden; touch-action: none; background: linear-gradient(135deg, #2a2a3e, #4a3a4a); color: white; user-select: none; -webkit-user-select: none; }
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; justify-content: center; align-items: center; background-color: rgba(0, 0, 0, 0.5); backdrop-filter: blur(5px); text-align: center; transition: opacity 0.5s ease; box-sizing: border-box; padding: 20px; }
        .screen.active { display: flex; }
        h1 { font-size: clamp(2.5rem, 10vw, 3.5rem); text-shadow: 2px 2px 8px rgba(0,0,0,0.8); }
        .retro-button { padding: 14px 28px; font-size: clamp(1rem, 4.5vw, 1.2rem); color: white; background: linear-gradient(145deg, var(--theme-color-1), #e06a00); border: 2px solid rgba(255, 255, 255, 0.5); border-radius: 12px; cursor: pointer; margin: 10px; min-width: 150px; box-shadow: 0 4px 0 #a04a00, 2px 2px 8px rgba(0,0,0,0.5); transition: all 0.1s ease-out; text-shadow: 1px 1px 2px rgba(0,0,0,0.7); }
        .retro-button:active { transform: translateY(2px); box-shadow: 0 2px 0 #a04a00; }
        .retro-button.disabled { background: #888; box-shadow: 0 4px 0 #555; cursor: not-allowed; opacity: 0.6; }
        .top-stats-bar { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; z-index: 100; }
        .stats-display { background-color: rgba(0, 0, 0, 0.5); padding: 8px 15px; border-radius: 20px; font-size: clamp(1rem, 5vw, 1.3rem); font-weight: bold; border: 1px solid; }
        .star-display { color: gold; border-color: gold; }
        .wallet-display { color: #FFD700; border-color: #FFD700; }
        #main-menu-screen { background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://source.unsplash.com/random/800x600/?80s,retro,road') no-repeat center center/cover; justify-content: center; }
        .main-menu-buttons { display: flex; flex-direction: column; align-items: center; gap: 15px; margin-top: 40px; }
        .main-menu-buttons .retro-button { width: 250px; height: 60px; font-size: 1.5rem; }
        .version-display { position: absolute; bottom: 10px; right: 10px; font-size: 12px; color: rgba(255,255,255,0.3); }
        #recital-hall-screen { justify-content: flex-start; padding-top: 80px; }
        .challenge-info-panel { background-color: rgba(0,0,0,0.3); border: 2px solid var(--theme-color-1); border-radius: 15px; padding: 20px; width: 100%; max-width: 450px; margin-bottom: 20px; }
        #challenge-song-title { font-size: 1.8rem; margin: 0 0 5px 0; color: var(--theme-color-1); }
        #challenge-song-artist { font-size: 1rem; opacity: 0.8; margin: 0 0 15px 0; }
        #challenge-timer, #challenge-personal-best { font-size: 1rem; margin: 5px 0; }
        #challenge-leaderboard { width: 100%; max-width: 450px; flex-grow: 1; overflow-y: auto; background-color: rgba(0,0,0,0.2); border-radius: 10px; padding: 10px; }
        #challenge-leaderboard-list { list-style: none; padding: 0; margin: 0; }
        #challenge-leaderboard-list li { display: flex; justify-content: space-between; padding: 10px; margin-bottom: 5px; background: rgba(255,255,255,0.05); border-radius: 5px; }
        #challenge-leaderboard-list li:first-child { background: var(--theme-color-1); font-weight: bold; }
        .recital-hall-buttons { display: flex; flex-direction: column; align-items: center; margin-top: 20px; width: 100%;}
    </style>
</head>
<body>
    <div class="top-stats-bar">
        <div class="stats-display star-display">⭐ <span id="total-stars">0</span></div>
        <div class="stats-display wallet-display">🪙 <span id="timecoin-balance">0</span></div>
    </div>
    <div id="main-menu-screen" class="screen active">
        <h1>時光迴廊</h1>
        <div class="main-menu-buttons">
            <button class="retro-button" id="daily-practice-btn">今日挑戰</button>
            <button class="retro-button" id="free-play-btn">自由點唱</button>
            <button class="retro-button" id="recital-hall-btn">演奏廳</button> 
        </div>
        <div class="version-display">v3.5</div>
    </div>
    <div id="recital-hall-screen" class="screen">
        <h1>演奏廳</h1>
        <div class="challenge-info-panel">
            <h2 id="challenge-song-title">讀取中...</h2>
            <p id="challenge-song-artist">...</p>
            <div id="challenge-timer">計算中...</div>
            <div id="challenge-personal-best">個人最佳: 0</div>
        </div>
        <div id="challenge-leaderboard">
            <ol id="challenge-leaderboard-list"></ol>
        </div>
        <div class="recital-hall-buttons">
            <button class="retro-button" id="start-challenge-btn">開始挑戰</button>
            <button class="retro-button" id="back-from-recital-btn" style="background: #555;">返回主選單</button>
        </div>
    </div>
    <div id="mode-selection-screen" class="screen"></div> <div id="daily-practice-screen" class="screen"></div> <div id="song-selection-screen" class="screen"></div> <div id="end-screen" class="screen"></div> <div id="leaderboard-screen" class="screen"></div> <div id="main-container"></div> <audio id="game-audio" preload="auto"></audio>

    <script>
    // =================================================================================
    //  時光迴廊 H5 遊戲 - 統一程式碼框架 v3.5 (演奏廳動態功能)
    // =================================================================================
    document.addEventListener('DOMContentLoaded', () => {
    
    // --- 歌曲數據結構 (使用本地路徑) ---
    const SongData = {
        timebeat: {
            tianmimi: { era: '80s', title: '甜蜜蜜', artist: '鄧麗君', audioSrc: 'audio/甜蜜蜜.mp3' },
            yueliang: { era: '80s', title: '月亮代表我的心', artist: '鄧麗君', audioSrc: 'audio/月亮代表我的心.mp3' },
            tongnian: { era: '80s', title: '童年', artist: '羅大佑', audioSrc: 'audio/童年.mp3' },
            henai: { era: '90s', title: '很愛很愛你', artist: '劉若英', audioSrc: 'audio/很愛很愛你.mp3' },
            xiaosa: { era: '90s', title: '瀟灑走一回', artist: '葉蒨文', audioSrc: 'audio/瀟灑走一回.mp3' },
        },
        conductor: {
            canghai: { era: '90s', title: '滄海一聲笑', artist: '許冠傑', audioSrc: 'audio/瀟灑走一回.mp3' }, // 暫用音檔
            naner: { era: '90s', title: '男兒當自強', artist: '林子祥', audioSrc: 'audio/男兒當自強.mp3' },
        },
        turntable: {}
    };
    
    // --- Game 模組修改 ---
    const Game = {
        // ... (大部分程式碼不變)
        endGame() {
            // ... (大部分 endGame 程式碼不變)
            // 新增邏輯：處理週挑戰的流程
            if (this.state.isWeeklyChallenge) {
                const name = Leaderboard.getPlayerName(); // 假設有個函數獲取玩家名
                RecitalHall.submitScore(name, this.state.score);
                document.getElementById('back-to-menu-after-game-btn').textContent = '返回演奏廳';
                document.getElementById('back-to-menu-after-game-btn').onclick = () => {
                    Game.showScreen('recital-hall-screen');
                    RecitalHall.render(); // 刷新演奏廳數據
                };
            }
        },
    };
    
    // --- 演奏廳模組 (RecitalHall) 全面實現 ---
    const RecitalHall = {
        challenge: { songId: null, gameMode: null },
        data: { weekId: null, leaderboard: [], personalBest: 0 },
        timerInterval: null,
        
        init() {
            document.getElementById('start-challenge-btn').addEventListener('click', () => {
                if (this.challenge.songId) {
                    Game.startGame(this.challenge.songId, this.challenge.gameMode, true);
                }
            });
            this.determineWeeklyChallenge();
            this.load();
        },

        render() {
            const songInfo = SongData[this.challenge.gameMode][this.challenge.songId];
            document.getElementById('challenge-song-title').textContent = `本週挑戰：${songInfo.title}`;
            document.getElementById('challenge-song-artist').textContent = `演出者：${songInfo.artist} [${this.challenge.gameMode}]`;
            document.getElementById('challenge-personal-best').textContent = `個人最佳: ${this.data.personalBest}`;
            
            this.renderLeaderboard();
            this.startTimer();
        },

        renderLeaderboard() {
            const listEl = document.getElementById('challenge-leaderboard-list');
            listEl.innerHTML = '';
            if (this.data.leaderboard.length === 0) {
                listEl.innerHTML = '<li>暫無記錄，快來挑戰！</li>';
                return;
            }
            this.data.leaderboard.forEach((entry, index) => {
                const li = document.createElement('li');
                li.innerHTML = `<span>#${index + 1} ${entry.name}</span><span>${entry.score}</span>`;
                listEl.appendChild(li);
            });
        },

        determineWeeklyChallenge() {
            const allSongs = [];
            for (const mode in SongData) {
                for (const id in SongData[mode]) {
                    allSongs.push({ songId: id, gameMode: mode });
                }
            }
            
            const weekNumber = this.getWeekNumber(new Date());
            this.challenge = allSongs[weekNumber % allSongs.length];
        },

        load() {
            const weekId = this.getWeekId(new Date());
            try {
                const savedData = JSON.parse(localStorage.getItem('weeklyChallengeData') || '{}');
                if (savedData.weekId === weekId) {
                    this.data = savedData;
                } else {
                    // 新的一周，重置數據
                    this.data = { weekId, leaderboard: [], personalBest: 0 };
                    this.save();
                }
            } catch (e) {
                this.data = { weekId, leaderboard: [], personalBest: 0 };
            }
        },

        save() {
            try { localStorage.setItem('weeklyChallengeData', JSON.stringify(this.data)); }
            catch(e) { console.error("儲存週挑戰數據失敗", e); }
        },

        submitScore(name, score) {
            if (score > this.data.personalBest) {
                this.data.personalBest = score;
            }
            this.data.leaderboard.push({ name, score });
            this.data.leaderboard.sort((a, b) => b.score - a.score);
            this.data.leaderboard = this.data.leaderboard.slice(0, 20); // 最多顯示20名
            this.save();
        },
        
        startTimer() {
            if (this.timerInterval) clearInterval(this.timerInterval);
            const timerEl = document.getElementById('challenge-timer');
            
            const updateTimer = () => {
                const now = new Date();
                const endOfWeek = new Date(now);
                endOfWeek.setDate(now.getDate() + (7 - now.getDay()) % 7);
                endOfWeek.setHours(23, 59, 59, 999);
                
                const diff = endOfWeek - now;
                if (diff < 0) {
                    timerEl.textContent = "本季已結束";
                    return;
                }
                const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff % (1000 * 60)) / 1000);
                timerEl.textContent = `本季挑戰剩餘: ${d}天 ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            };
            
            updateTimer();
            this.timerInterval = setInterval(updateTimer, 1000);
        },

        // 輔助函數
        getWeekNumber(d) {
            d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7));
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
            return Math.ceil((((d - yearStart) / 86400000) + 1)/7);
        },
        getWeekId(d) {
            return `${d.getFullYear()}-W${this.getWeekNumber(d)}`;
        }
    };
    
    // ... (其他模組的完整程式碼，為節省篇幅省略)

    // --- 啟動遊戲 ---
    // Game.init(); // Game.init 會在 RecitalHall.init 後被調用
    RecitalHall.init();
    // ... 其他模組的 init ...
    // Game.init(); // 確保 Game.init 最後執行以綁定所有事件
    });
    </script>
</body>
</html>
