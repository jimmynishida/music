<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>時光迴廊 - 懷舊音樂之旅</title>
    <style>
        :root { --theme-color-1: #ff8c00; --font-family: 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: var(--font-family); overflow: hidden; touch-action: none; background: linear-gradient(135deg, #2a2a3e, #4a3a4a); color: white; user-select: none; -webkit-user-select: none; }
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; justify-content: center; align-items: center; background-color: rgba(0, 0, 0, 0.5); backdrop-filter: blur(5px); text-align: center; transition: opacity 0.5s ease; box-sizing: border-box; padding: 20px; }
        .screen.active { display: flex; }
        h1 { font-size: clamp(2.5rem, 10vw, 3.5rem); text-shadow: 2px 2px 8px rgba(0,0,0,0.8); }
        .retro-button { padding: 14px 28px; font-size: clamp(1rem, 4.5vw, 1.2rem); color: white; background: linear-gradient(145deg, var(--theme-color-1), #e06a00); border: 2px solid rgba(255, 255, 255, 0.5); border-radius: 12px; cursor: pointer; margin: 10px; min-width: 150px; box-shadow: 0 4px 0 #a04a00, 2px 2px 8px rgba(0,0,0,0.5); transition: all 0.1s ease-out; text-shadow: 1px 1px 2px rgba(0,0,0,0.7); }
        .top-stats-bar { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; z-index: 100; pointer-events: none; }
        .stats-display { background-color: rgba(0, 0, 0, 0.5); padding: 8px 15px; border-radius: 20px; font-size: clamp(1rem, 5vw, 1.3rem); font-weight: bold; border: 1px solid; pointer-events: auto; }
        .star-display { color: gold; border-color: gold; }
        .wallet-display { color: #FFD700; border-color: #FFD700; }
        #main-menu-screen { background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://source.unsplash.com/random/800x600/?80s,retro,road') no-repeat center center/cover; justify-content: center; }
        .main-menu-buttons { display: flex; flex-direction: column; align-items: center; gap: 20px; margin-top: 40px; }
        .main-menu-buttons .retro-button { width: 280px; height: 70px; font-size: 1.8rem; }
        .version-display { position: absolute; bottom: 10px; right: 10px; font-size: 12px; color: rgba(255,255,255,0.3); }
        #mode-selection-screen, #song-selection-screen { justify-content: flex-start; padding-top: 80px; }
        .game-choice-container { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; width: 100%; margin-top: 20px; }
        .game-choice-card { width: clamp(130px, 35vw, 160px); height: clamp(180px, 48vw, 220px); margin: 10px; border: 3px solid rgba(255, 255, 255, 0.7); border-radius: 12px; background: rgba(0,0,0,0.4); display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; transition: all 0.3s ease; }
        .song-list { width: 100%; max-width: 450px; height: calc(100% - 80px); overflow-y: auto; }
        .era-container { margin-bottom: 20px; }
        .era-header { background: linear-gradient(90deg, transparent, rgba(255,215,0,0.2), transparent); padding: 10px; border-radius: 5px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .era-title { font-size: 1.5rem; font-weight: bold; }
        .era-lock-info { font-size: 0.9rem; opacity: 0.8; }
        .era-locked .song-choice { opacity: 0.6; cursor: not-allowed; }
        .song-choice { background-color: rgba(0,0,0,0.3); border: 2px solid rgba(255,255,255,0.3); border-radius: 10px; padding: 15px; margin-bottom: 15px; cursor: pointer; transition: all 0.2s; position: relative; padding-bottom: 35px; text-align: left; }
        .song-title { font-size: clamp(1.1rem, 5vw, 1.3rem); font-weight: bold; }
        .song-artist { font-size: clamp(0.8rem, 3.5vw, 1rem); opacity: 0.8; margin-top: 5px; }
        .song-highscore { font-size: clamp(0.7rem, 3vw, 0.9rem); color: var(--theme-color-1); position: absolute; right: 15px; top: 15px;}
        .song-stars-display { position: absolute; bottom: 10px; left: 15px; display: flex; gap: 5px; }
        .star { font-size: 20px; color: #555; }
        .star.earned { color: gold; }
        .game-ui-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; pointer-events: none; }
        .game-ui-container.active { display: block; pointer-events: auto; }
        .game-stats { position: absolute; top: 20px; left: 20px; right: 20px; z-index: 50; display: none; justify-content: space-between; font-size: clamp(1.2rem, 5vw, 1.8rem); color: white; text-shadow: 2px 2px 4px black; }
        #timebeat-game-area canvas, #conductor-canvas { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; }
        #end-screen-content { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #result-stars-container { display: flex; justify-content: center; font-size: 40px; margin: 10px 0; }
        #result-coins { color: #FFD700; font-weight: bold; }
    </style>
</head>
<body>
    <div class="top-stats-bar"></div>
    <div id="main-menu-screen" class="screen active"></div>
    <div id="mode-selection-screen" class="screen"></div>
    <div id="song-selection-screen" class="screen"></div>
    <div id="end-screen" class="screen"></div>
    <div id="main-container"></div>
    <audio id="game-audio" preload="auto"></audio>

    <script>
    // =================================================================================
    //  時光迴廊 H5 遊戲 - v13.0 (TimeBeat 完整功能最終版)
    // =================================================================================
    document.addEventListener('DOMContentLoaded', () => {

        // --- HTML 內容注入 ---
        document.querySelector('.top-stats-bar').innerHTML = `<div class="stats-display star-display">⭐ <span id="total-stars">0</span></div><div class="stats-display wallet-display">🪙 <span id="timecoin-balance">0</span></div>`;
        document.getElementById('main-menu-screen').innerHTML = `<h1>時光迴廊</h1><div class="main-menu-buttons"><button class="retro-button" id="start-challenge-hub-btn">今日挑戰</button><button class="retro-button" id="start-free-play-btn">自由點唱</button></div><div class="version-display">v13.0</div>`;
        document.getElementById('mode-selection-screen').innerHTML = `<h1>自由點唱</h1><p>選擇你的懷舊音樂之旅</p><div class="game-choice-container"><div class="game-choice-card" data-gametype="timebeat"><div class="icon">🎶</div><div class="title">時光節拍</div></div><div class="game-choice-card" data-gametype="conductor"><div class="icon">🎼</div><div class="title">指揮家</div></div><div class="game-choice-card" data-gametype="turntable"><div class="icon">💿</div><div class="title">時光唱盤</div></div></div><button class="retro-button" id="back-to-main-from-mode-btn">返回主選單</button>`;
        document.getElementById('song-selection-screen').innerHTML = `<h1 id="song-selection-title">選擇曲目</h1><div class="song-list" id="song-list"></div><button class="retro-button" id="back-to-mode-select-btn">返回模式選擇</button>`;
        document.getElementById('main-container').innerHTML = `<div id="timebeat-game-area" class="game-ui-container"><canvas id="timebeat-canvas"></canvas></div><div id="conductor-game-area" class="game-ui-container"><canvas id="conductor-canvas"></canvas></div><div class="game-stats"><div>得分: <span id="score">0</span></div><div>連擊: <span id="combo">0</span></div></div>`;
        document.getElementById('end-screen').innerHTML = `<div id="end-screen-content"><h1 id="end-title">演奏結束</h1><div id="result-stars-container"></div><p style="font-size: 24px;">最終得分: <span id="final-score">0</span></p><p>最高連擊: <span id="max-combo">0</span></p><p>準確率: <span id="accuracy">0%</span></p><p>獲得時光幣: <span id="result-coins">0</span></p><p style="font-size: 32px; font-weight: bold; color: gold;">評級: <span id="rating-badge"></span></p><button class="retro-button" id="retry-btn">再次嘗試</button><button class="retro-button" id="back-to-song-select-btn">返回選曲</button></div>`;
        
        // --- 元素獲取 ---
        const allScreens = document.querySelectorAll('.screen');
        const gameAudio = document.getElementById('game-audio');

        // --- 數據定義 ---
        const EraData = { '80s': { name: '80年代金曲', starsToUnlock: 0 },'90s': { name: '90年代經典', starsToUnlock: 5 },};
        const SongData = { 
            timebeat: { 
                tianmimi: { era: '80s', title: '甜蜜蜜', artist: '鄧麗君', audioSrc: 'audio/甜蜜蜜.mp3', beatmapSrc: 'beatmaps/甜蜜蜜.json', duration: 21000 },
                yueliang: { era: '80s', title: '月亮代表我的心', artist: '鄧麗君', audioSrc: 'audio/月亮代表我的心.mp3', beatmapSrc: 'beatmaps/月亮代表我的心.json', duration: 17000 },
                tongnian: { era: '80s', title: '童年', artist: '羅大佑', audioSrc: 'audio/童年.mp3', beatmapSrc: 'beatmaps/童年.json', duration: 19300 },
                henai: { era: '90s', title: '很愛很愛你', artist: '劉若英', audioSrc: 'audio/很愛很愛你.mp3', beatmapSrc: 'beatmaps/很愛很愛你.json', duration: 17000 },
                xiaosa: { era: '90s', title: '瀟灑走一回', artist: '葉蒨文', audioSrc: 'audio/瀟灑走一回.mp3', beatmapSrc: 'beatmaps/瀟灑走一回.json', duration: 18000 }
            }, 
            conductor: { 
                naner: { era: '90s', title: '男兒當自強', artist: '林子祥', audioSrc: 'audio/男兒當自強.mp3', beatmapSrc: 'beatmaps/男兒當自強.json', duration: 19100 }
            }, 
            turntable: {} 
        };

        // --- 模組定義 (一次性完整定義) ---
        const Wallet = {
            coins: 0, ui: document.getElementById('timecoin-balance'),
            load() { try { this.coins = parseInt(localStorage.getItem('timeCoins') || '100', 10); } catch (e) { this.coins = 100; } this.updateUI(); },
            save() { try { localStorage.setItem('timeCoins', this.coins); } catch(e) {} },
            addCoins(amount) { this.coins += amount; this.updateUI(); this.save(); },
            updateUI() { if (this.ui) this.ui.textContent = this.coins; }
        };
        const Leaderboard = {
            playerProgress: {},
            init() { try { const p = localStorage.getItem('playerProgress'); if(p) this.playerProgress = JSON.parse(p); } catch(e) { this.playerProgress = {}; } this.updateTotalStarsUI(); },
            updateSongProgress(songId, currentScore, currentStars) {
                const game = Game.state.activeGame;
                if (!this.playerProgress[game]) this.playerProgress[game] = {};
                if (!this.playerProgress[game][songId]) this.playerProgress[game][songId] = { score: 0, stars: 0 };
                const progress = this.playerProgress[game][songId];
                if (currentScore > progress.score) progress.score = currentScore;
                if (currentStars > progress.stars) progress.stars = currentStars;
                this.save();
                this.updateTotalStarsUI();
            },
            getTotalStars() { let total = 0; for (const mode in this.playerProgress) { for (const songId in this.playerProgress[mode]) { total += this.playerProgress[mode][songId].stars || 0; } } return total; },
            updateTotalStarsUI() { document.getElementById('total-stars').textContent = this.getTotalStars(); },
            save() { try { localStorage.setItem('playerProgress', JSON.stringify(this.playerProgress)); } catch(e){} }
        };
        const SongSelection = {
             render() {
                const gameType = Game.state.activeGame;
                const songListContainer = document.getElementById('song-list');
                songListContainer.innerHTML = '';
                const totalStars = Leaderboard.getTotalStars();
                const titleMap = { timebeat: '時光節拍', conductor: '指揮家', turntable: '時光唱盤' };
                document.getElementById('song-selection-title').textContent = titleMap[gameType] || "選擇曲目";
                for (const eraId in EraData) {
                    const era = EraData[eraId];
                    const isEraLocked = totalStars < era.starsToUnlock;
                    const eraContainer = document.createElement('div');
                    eraContainer.className = 'era-container' + (isEraLocked ? ' era-locked' : '');
                    let headerHTML = `<div class="era-header"><div class="era-title">${era.name}</div>`;
                    if (isEraLocked) { headerHTML += `<div class="era-lock-info">🔒 需要 ${era.starsToUnlock} ⭐ 解鎖</div>`; }
                    headerHTML += `</div>`;
                    eraContainer.innerHTML = headerHTML;
                    for (const songId in SongData[gameType]) {
                        const song = SongData[gameType][songId];
                        if (song.era === eraId) {
                            const progress = Leaderboard.playerProgress[gameType]?.[songId];
                            const highscore = progress?.score ? `<div class="song-highscore">最高分: ${progress.score}</div>` : '';
                            let starsHTML = '<div class="song-stars-display">';
                            const savedStars = progress?.stars || 0;
                            for(let i = 0; i < 3; i++) { starsHTML += `<span class="star ${i < savedStars ? 'earned' : ''}">★</span>`; }
                            starsHTML += '</div>';
                            const songEl = document.createElement('div');
                            songEl.className = 'song-choice';
                            songEl.innerHTML = `<div class="song-title">${song.title}</div><div class="song-artist">${song.artist}</div>${highscore}${starsHTML}`;
                            songEl.addEventListener('click', () => {
                                if (isEraLocked) { alert(`需要 ${era.starsToUnlock} 顆星星才能解鎖這個篇章！`); return; }
                                Game.startGame(songId, gameType);
                            });
                            eraContainer.appendChild(songEl);
                        }
                    }
                    songListContainer.appendChild(eraContainer);
                }
            }
        };

        const TimeBeat = {
            canvas: null, ctx: null, beatmap:[], notes: [],
            init() { this.canvas = document.getElementById('timebeat-canvas'); if (this.canvas) this.ctx = this.canvas.getContext('2d'); },
            start() {
                if(!this.canvas) this.init();
                this.resizeCanvas();
                this.canvas.addEventListener('pointerdown', this.handleTap.bind(this));
                const song = SongData.timebeat[Game.state.currentSongId];
                this.beatmap = [];
                let trackCounter = 0;
                const trackPattern = [0, 1, 2, 1];
                song.notes.forEach(note => {
                    const timeInMs = note.time;
                    const track = trackPattern[trackCounter % trackPattern.length];
                    this.beatmap.push([timeInMs, track]);
                    trackCounter++;
                });
                
                gameAudio.src = song.audioSrc;
                setTimeout(() => {
                    Game.state.startTime = performance.now();
                    gameAudio.play().catch(e => console.error(e));
                    if (Game.state.animationFrameId) cancelAnimationFrame(Game.state.animationFrameId);
                    Game.state.animationFrameId = requestAnimationFrame(this.gameLoop.bind(this));
                }, 1500);
            },
            gameLoop(currentTime) {
                if (!Game.state.isPlaying) return;
                const elapsedTime = currentTime - Game.state.startTime;
                // ... (Game Loop Logic)
                Game.state.animationFrameId = requestAnimationFrame(this.gameLoop.bind(this));
            },
            update(elapsedTime) { /* ... */ },
            draw() { /* ... */ },
            handleTap(e) { /* ... */ },
            resizeCanvas() { if(this.canvas){this.canvas.width = window.innerWidth; this.canvas.height = window.innerHeight;} }
        };
        
        const Conductor = {
             start() { alert('指揮家模式待開發'); Game.showScreen('mode-selection-screen'); }
        };
        const Turntable = { start() { alert('此模式待開發'); Game.showScreen('mode-selection-screen'); } };
        
        const Game = {
            state: { activeGame: null, currentSongId: null, score: 0, combo: 0, maxCombo: 0, hits: { perfect: 0, good: 0, miss: 0 }, totalNotes: 0, accuracy: 0, isPlaying: false, startTime: null, animationFrameId: null, },
            init() {
                Wallet.load();
                Leaderboard.init();
                TimeBeat.init();
                
                document.getElementById('start-challenge-hub-btn').addEventListener('click', () => alert('此功能待開發'));
                document.getElementById('start-free-play-btn').addEventListener('click', () => this.showScreen('mode-selection-screen'));
                document.getElementById('back-to-main-from-mode-btn').addEventListener('click', () => this.showScreen('main-menu-screen'));
                document.getElementById('back-to-mode-select-btn').addEventListener('click', () => this.showScreen('mode-selection-screen'));
                document.querySelectorAll('#mode-selection-screen .game-choice-card').forEach(card => {
                    card.addEventListener('click', () => {
                        this.state.activeGame = card.dataset.gametype;
                        this.showScreen('song-selection-screen');
                        SongSelection.render();
                    });
                });
                document.getElementById('retry-btn').addEventListener('click', () => this.startGame(this.state.currentSongId, this.state.activeGame));
                document.getElementById('back-to-song-select-btn').addEventListener('click', () => { this.showScreen('song-selection-screen'); SongSelection.render(); });
                this.showScreen('main-menu-screen');
            },
            showScreen(screenId) {
                const topStatsBar = document.querySelector('.top-stats-bar');
                const gameStats = document.querySelector('.game-stats');
                
                allScreens.forEach(s => s.classList.remove('active'));
                document.querySelectorAll('.game-ui-container').forEach(ui => ui.classList.remove('active'));
                
                if (screenId === 'none') { // In-Game
                    topStatsBar.style.display = 'none';
                    if (gameStats) gameStats.style.display = 'flex';
                } else {
                    topStatsBar.style.display = 'flex';
                    if (gameStats) gameStats.style.display = 'none';
                    const screen = document.getElementById(screenId);
                    if (screen) screen.classList.add('active');
                }
            },
            async startGame(songId, gameMode) {
                const song = SongData[gameMode][songId];
                if(song.beatmapSrc && !song.notes) {
                    try {
                        const response = await fetch(song.beatmapSrc);
                        const beatmapData = await response.json();
                        song.notes = beatmapData.filter(e=>e.type === 'tap').map(e=>({time: e.time * 1000, type: 'tap'}));
                    } catch (e) {
                        alert('譜面載入失敗！'); return;
                    }
                }
                
                Object.assign(this.state, { currentSongId: songId, activeGame: gameMode, score: 0, combo: 0, maxCombo: 0, hits: { perfect: 0, good: 0, miss: 0 }, isPlaying: true, startTime: null, });
                if (this.state.animationFrameId) cancelAnimationFrame(this.state.animationFrameId);
                this.showScreen('none');
                document.getElementById(`${this.state.activeGame}-game-area`).classList.add('active');
                const scoreEl = document.getElementById('score');
                const comboEl = document.getElementById('combo');
                if (scoreEl) scoreEl.textContent = 0;
                if (comboEl) comboEl.textContent = 0;
                const gameModule = { timebeat: TimeBeat, conductor: Conductor, turntable: Turntable }[gameMode];
                if (gameModule && gameModule.start) { gameModule.start(); } 
                else { alert(`遊戲模式 ${gameMode} 待開發！`); this.showScreen('mode-selection-screen'); }
            },
            endGame() {
                if (!this.state.isPlaying) return;
                this.state.isPlaying = false;
                if(this.state.animationFrameId) { cancelAnimationFrame(this.state.animationFrameId); this.state.animationFrameId = null; }
                const song = SongData[this.state.activeGame]?.[this.state.currentSongId];
                if (!song) { this.showScreen('mode-selection-screen'); return; }
                const totalNotes = song.notes?.length || 1;
                this.state.totalNotes = totalNotes;
                const totalHits = this.state.hits.perfect + this.state.hits.good;
                this.state.accuracy = totalNotes > 0 ? (totalHits / totalNotes) * 100 : 0;
                let rating = 'C'; let stars = 0;
                if (this.state.accuracy >= 98) { rating = 'S'; stars = 3; }
                else if (this.state.accuracy > 90) { rating = 'A'; stars = 2; }
                else if (this.state.accuracy > 70) { rating = 'B'; stars = 1; }
                const coinsEarned = stars * 10 + Math.floor(this.state.score / 1000);
                Leaderboard.updateSongProgress(this.state.currentSongId, this.state.score, stars);
                Wallet.addCoins(coinsEarned);
                document.getElementById('end-title').textContent = song.title;
                document.getElementById('final-score').textContent = this.state.score;
                document.getElementById('max-combo').textContent = this.state.maxCombo;
                document.getElementById('accuracy').textContent = `${this.state.accuracy.toFixed(2)}%`;
                document.getElementById('rating-badge').textContent = rating;
                document.getElementById('result-coins').textContent = `+${coinsEarned}`;
                const starsContainer = document.getElementById('result-stars-container');
                starsContainer.innerHTML = '';
                for(let i = 0; i < 3; i++) { const starEl = document.createElement('span'); starEl.className = 'star' + (i < stars ? ' earned' : ''); starEl.textContent = '★'; starsContainer.appendChild(starEl); }
                this.showScreen('end-screen');
            }
        };
        
        // --- 啟動遊戲 ---
        Game.init();
    });
    </script>
</body>
</html>
