<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>時光迴廊 - 完整版</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: sans-serif; overflow: hidden; touch-action: manipulation; background: #1a1a1a; color: white; user-select: none; -webkit-user-select: none; }
        .screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; justify-content: center; align-items: center; background-color: rgba(0, 0, 0, 0.7); text-align: center; padding: 20px; box-sizing: border-box; }
        .screen.active { display: flex; }
        h1 { font-size: 3rem; } h2 { font-size: 1.5rem; }
        .retro-button { padding: 15px 30px; font-size: 1.5rem; color: white; background: #ff8c00; border: 2px solid #fff; border-radius: 12px; cursor: pointer; margin: 10px; }
        #main-menu-screen { background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://source.unsplash.com/random/800x600/?80s,retro,road') no-repeat center center/cover; }
        #mode-selection-screen, #song-selection-screen { justify-content: flex-start; padding-top: 80px; }
        .game-choice-card { width: clamp(100px, 28vw, 150px); height: clamp(120px, 35vw, 200px); margin: 5px; border: 3px solid #fff; border-radius: 12px; display: flex; justify-content: center; align-items: center; cursor: pointer; text-align: center; }
        .song-choice { background-color: rgba(0,0,0,0.3); border: 2px solid #fff; border-radius: 10px; padding: 15px; margin-bottom: 15px; cursor: pointer; width: 100%; box-sizing: border-box; }
        .game-ui-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; }
        .game-ui-container.active { display: block; }
        .game-stats { position: fixed; top: 20px; left: 20px; right: 20px; z-index: 50; display: flex; justify-content: space-between; font-size: 1.5rem; color: white; text-shadow: 2px 2px 4px black; }
        canvas { position: absolute; top:0; left: 0; width: 100%; height: 100%; }
        #turntable-tonearm { position: absolute; width: 150px; height: 30px; transform-origin: 15px 15px; pointer-events: none; z-index: 10; transform: rotate(25deg); }
        #turntable-tonearm::before { content: ''; position: absolute; width: 130px; height: 8px; background: #ccc; border-radius: 4px; top: 11px; left: 10px; }
        #turntable-tonearm::after { content: ''; position: absolute; width: 20px; height: 30px; background: #888; border-radius: 4px; top: 0; left: 130px; }
    </style>
</head>
<body>
    <div id="main-menu-screen" class="screen">
        <h1>時光迴廊</h1>
        <button class="retro-button" id="start-btn">開始遊戲</button>
    </div>
    <div id="mode-selection-screen" class="screen">
        <h1>選擇模式</h1>
        <div style="display:flex;">
            <div class="game-choice-card" data-gametype="timebeat"><h2>時光節拍</h2></div>
            <div class="game-choice-card" data-gametype="conductor"><h2>指揮家</h2></div>
            <div class="game-choice-card" data-gametype="turntable"><h2>時光唱盤</h2></div>
        </div>
        <button class="retro-button" id="back-to-main-btn">返回主選單</button>
    </div>
    <div id="song-selection-screen" class="screen">
        <h1 id="song-list-title">選擇歌曲</h1>
        <div id="song-list" style="width:100%; max-width: 400px; height: 70%; overflow-y: auto;"></div>
        <button class="retro-button" id="back-to-mode-btn">返回模式選擇</button>
    </div>
    <div id="end-screen" class="screen">
        <h1>演奏結束</h1>
        <p>得分: <span id="final-score">0</span></p>
        <button class="retro-button" id="retry-btn">重試</button>
        <button class="retro-button" id="back-to-songs-btn">返回選曲</button>
    </div>
    <div id="game-container">
        <div class="game-stats" style="display: none;">
            <span>分數: <span id="score">0</span></span>
            <span>連擊: <span id="combo">0</span></span>
        </div>
        <div id="timebeat-game-area" class="game-ui-container"><canvas id="timebeat-canvas"></canvas></div>
        <div id="conductor-game-area" class="game-ui-container"></div>
        <div id="turntable-game-area" class="game-ui-container"></div>
    </div>
    <audio id="game-audio" preload="auto"></audio>

    <script>
    // =================================================================================
    //  時光迴廊 H5 遊戲 - v21.0 (完整功能穩定版)
    // =================================================================================
    document.addEventListener('DOMContentLoaded', () => {
        console.log("DOM is ready. Initializing game v21.0...");

        const SongData = { tianmimi: { title: '甜蜜蜜', beatmapSrc: 'beatmaps/甜蜜蜜.json', audioSrc: 'audio/甜蜜蜜.mp3', duration: 21000, availableModes: ['timebeat', 'turntable'] }, yueliang: { title: '月亮代表我的心', beatmapSrc: 'beatmaps/月亮代表我的心.json', audioSrc: 'audio/月亮代表我的心.mp3', duration: 17000, availableModes: ['timebeat', 'conductor'] }, naner: { title: '男兒當自強', beatmapSrc: 'beatmaps/男兒當自強.json', audioSrc: 'audio/男兒當自強.mp3', duration: 19100, availableModes: ['conductor', 'turntable'] } };

        const TimeBeat = {
            canvas: null, ctx: null, notes: [], beatmap: [], nextNoteIndex: 0,
            init() { this.canvas = document.getElementById('timebeat-canvas'); this.ctx = this.canvas.getContext('2d'); window.addEventListener('resize', this.resize.bind(this)); },
            resize() { if (this.canvas) { this.canvas.width = window.innerWidth; this.canvas.height = window.innerHeight; } },
            start(beatmap) { this.resize(); this.notes = []; this.nextNoteIndex = 0; this.beatmap = beatmap.map((note, i) => ({ ...note, track: i % 3 })); this.boundHandleTap = this.handleTap.bind(this); this.canvas.addEventListener('pointerdown', this.boundHandleTap); },
            stop() { this.canvas.removeEventListener('pointerdown', this.boundHandleTap); },
            update(elapsedTime) {
                while (this.nextNoteIndex < this.beatmap.length && this.beatmap[this.nextNoteIndex].time < elapsedTime + 2000) { this.notes.push({ ...this.beatmap[this.nextNoteIndex], y: 0, active: true }); this.nextNoteIndex++; }
                const hitLineY = this.canvas.height * 0.85;
                this.notes.forEach(note => { if (note.active) { const timeDiff = note.time - elapsedTime; note.y = hitLineY - (timeDiff * 0.8); if (timeDiff < -150) { note.active = false; Game.updateCombo(false); } } });
                this.notes = this.notes.filter(n => n.active || n.y < this.canvas.height + 50);
            },
            draw() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                const hitLineY = this.canvas.height * 0.85;
                this.ctx.fillStyle = 'rgba(255, 215, 0, 0.5)'; this.ctx.fillRect(0, hitLineY - 25, this.canvas.width, 50);
                this.notes.forEach(note => { if (note.active) { const trackWidth = this.canvas.width / 3; const x = trackWidth * note.track + trackWidth / 2; this.ctx.fillStyle = note.type === 'strong' ? 'orangered' : 'cyan'; this.ctx.beginPath(); this.ctx.arc(x, note.y, 30, 0, Math.PI * 2); this.ctx.fill(); } });
            },
            handleTap(e) { if (!Game.state.isPlaying) return; const rect = this.canvas.getBoundingClientRect(); const x = e.clientX - rect.left; const track = Math.floor(x / (this.canvas.width / 3)); Game.handleHit(performance.now() - Game.getStartTime(), { track }); }
        };

        const Conductor = {
            gameArea: null, notes: [], beatmap: [], nextNoteIndex: 0,
            init() { this.gameArea = document.getElementById('conductor-game-area'); },
            start(beatmap) { this.notes = []; this.nextNoteIndex = 0; this.beatmap = beatmap; this.gameArea.innerHTML = ''; },
            stop() { this.gameArea.innerHTML = ''; },
            update(elapsedTime) {
                while (this.nextNoteIndex < this.beatmap.length && this.beatmap[this.nextNoteIndex].time <= elapsedTime + 200) {
                    const noteData = this.beatmap[this.nextNoteIndex];
                    const noteEl = this.createNoteElement(noteData, this.nextNoteIndex);
                    this.gameArea.appendChild(noteEl);
                    this.notes.push({ ...noteData, el: noteEl, active: true, id: this.nextNoteIndex });
                    this.nextNoteIndex++;
                }
                this.notes.forEach(note => { if (note.active && elapsedTime > note.time + 800) { note.active = false; note.el.style.opacity = '0'; Game.updateCombo(false); } });
                this.notes = this.notes.filter(note => note.active);
            },
            draw() {},
            createNoteElement(noteData, id) {
                const el = document.createElement('div');
                const isStrong = noteData.type === 'strong';
                const size = isStrong ? 80 : 50;
                el.style.cssText = `position:absolute; width:${size}px; height:${size}px; background:${isStrong ? 'orangered':'cyan'}; border-radius:50%; transition: transform 0.1s, opacity 0.3s; transform: scale(0); opacity: 1; box-shadow: 0 0 15px ${isStrong ? 'orangered':'cyan'}; cursor: pointer;`;
                el.style.left = `${10 + Math.random() * 70}%`;
                el.style.top = `${15 + Math.random() * 70}%`;
                el.dataset.id = id;
                setTimeout(() => el.style.transform = 'scale(1)', 50);
                el.addEventListener('pointerdown', e => {
                    e.stopPropagation();
                    const thisNote = this.notes.find(n => n.id == e.currentTarget.dataset.id);
                    if (!thisNote?.active) return;
                    let hasSwiped = false;
                    const onPointerMove = () => hasSwiped = true;
                    const onPointerUp = () => { document.removeEventListener('pointermove', onPointerMove); document.removeEventListener('pointerup', onPointerUp); if(hasSwiped) { Game.handleHit(performance.now() - Game.getStartTime(), { id: thisNote.id }); thisNote.active = false; e.currentTarget.style.transform = 'scale(1.2)'; e.currentTarget.style.opacity = '0'; } };
                    document.addEventListener('pointermove', onPointerMove);
                    document.addEventListener('pointerup', onPointerUp);
                });
                return el;
            }
        };

        const Turntable = {
            canvas: null, ctx: null, tonearm: null, notes: [], beatmap: [], nextNoteIndex: 0, rotation: 0,
            TONEARM_ANGLE: Math.PI / 4, JUDGEMENT_RADIUS_RATIO: 0.85, ROTATION_SPEED: (10 * Math.PI / 9), NOTE_LIFESPAN: 6000,
            init() { this.gameArea = document.getElementById('turntable-game-area'); this.gameArea.innerHTML = `<canvas id="turntable-canvas"></canvas><div id="turntable-tonearm"></div>`; this.canvas = document.getElementById('turntable-canvas'); this.tonearm = document.getElementById('turntable-tonearm'); if(this.canvas) this.ctx = this.canvas.getContext('2d'); window.addEventListener('resize', this.resize.bind(this)); },
            resize() { if(this.canvas){ this.canvas.width = window.innerWidth; this.canvas.height = window.innerHeight; } if(this.tonearm) { this.tonearm.style.top = `calc(50% - ${Math.min(window.innerWidth, window.innerHeight) * 0.4 * 0.9}px)`; this.tonearm.style.left = `calc(50% + ${Math.min(window.innerWidth, window.innerHeight) * 0.4 * 0.1}px)`; } },
            start(beatmap) { this.resize(); this.notes = []; this.nextNoteIndex = 0; this.rotation = 0; this.beatmap = beatmap.map((note, i) => ({ ...note, type: Math.random() > 0.7 ? 'strong' : 'tap', startAngle: (i * 2.3) % (Math.PI * 2) })); this.boundHandleInput = this.handleInput.bind(this); this.canvas.addEventListener('pointerdown', this.boundHandleInput); },
            stop() { if(this.canvas) this.canvas.removeEventListener('pointerdown', this.boundHandleInput); },
            update(elapsedTime) {
                this.rotation = (elapsedTime * 0.001) * this.ROTATION_SPEED;
                while (this.nextNoteIndex < this.beatmap.length && this.beatmap[this.nextNoteIndex].time < elapsedTime + this.NOTE_LIFESPAN) { this.notes.push({ ...this.beatmap[this.nextNoteIndex], active: true, spawnTime: elapsedTime }); this.nextNoteIndex++; }
                this.notes.forEach(note => { if (note.active) { const lifeTime = elapsedTime - note.spawnTime; note.radiusRatio = lifeTime / this.NOTE_LIFESPAN; if (note.radiusRatio > 1.15) { note.active = false; Game.updateCombo(false); } } });
                this.notes = this.notes.filter(n => n.active);
            },
            draw() {
                const { width, height } = this.canvas; const centerX = width / 2; const centerY = height / 2; const maxRadius = Math.min(width, height) * 0.4; const judgementRadius = maxRadius * this.JUDGEMENT_RADIUS_RATIO;
                this.ctx.clearRect(0, 0, width, height); this.ctx.save(); this.ctx.translate(centerX, centerY); this.ctx.rotate(this.rotation);
                this.ctx.strokeStyle = '#444'; this.ctx.lineWidth = 1; for(let i=0.1; i < 1; i+= 0.1) { this.ctx.beginPath(); this.ctx.arc(0, 0, maxRadius * i, 0, Math.PI * 2); this.ctx.stroke(); }
                this.ctx.restore(); this.ctx.strokeStyle = 'gold'; this.ctx.lineWidth = 2; this.ctx.beginPath(); this.ctx.arc(centerX, centerY, judgementRadius, 0, Math.PI * 2); this.ctx.stroke();
                this.notes.forEach(note => { if(note.active && note.radiusRatio > 0){ const angle = this.rotation + note.startAngle; const radius = judgementRadius * note.radiusRatio; const x = centerX + radius * Math.cos(angle); const y = centerY + radius * Math.sin(angle); this.ctx.fillStyle = note.type === 'strong' ? 'orangered' : 'cyan'; this.ctx.beginPath(); this.ctx.arc(x, y, 15 * (note.radiusRatio > 0.5 ? 1 : note.radiusRatio * 2), 0, Math.PI * 2); this.ctx.globalAlpha = note.radiusRatio; this.ctx.fill(); this.ctx.globalAlpha = 1; } });
            },
            handleInput(e) { const elapsedTime = performance.now() - Game.getStartTime(); let scratchActive = false; const onPointerMove = () => scratchActive = true; const onPointerUp = () => { document.removeEventListener('pointermove', onPointerMove); document.removeEventListener('pointerup', onPointerUp); Game.handleHit(elapsedTime, { type: scratchActive ? 'strong' : 'tap' }); }; document.addEventListener('pointermove', onPointerMove); document.addEventListener('pointerup', onPointerUp); }
        };

        const Game = {
            state: { activeGame: null, currentSongId: null, score: 0, combo: 0, isPlaying: false, startTime: 0, beatmap: [] },
            dom: {},
            modules: { timebeat: TimeBeat, conductor: Conductor, turntable: Turntable },
            init() {
                this.dom.screens = document.querySelectorAll('.screen');
                this.dom.gameUiContainers = document.querySelectorAll('.game-ui-container');
                this.dom.gameStats = document.querySelector('.game-stats');
                this.dom.score = document.getElementById('score');
                this.dom.combo = document.getElementById('combo');
                this.dom.finalScore = document.getElementById('final-score');
                this.dom.gameAudio = document.getElementById('game-audio');
                Object.values(this.modules).forEach(m => m.init?.());
                document.getElementById('start-btn').addEventListener('click', () => this.showScreen('mode-selection-screen'));
                document.getElementById('back-to-main-btn').addEventListener('click', () => this.showScreen('main-menu-screen'));
                document.getElementById('back-to-mode-btn').addEventListener('click', () => this.showScreen('mode-selection-screen'));
                document.getElementById('back-to-songs-btn').addEventListener('click', () => this.showScreen('song-selection-screen'));
                document.getElementById('retry-btn').addEventListener('click', () => this.startGame(this.state.currentSongId));
                document.querySelectorAll('.game-choice-card').forEach(card => card.addEventListener('click', () => { this.state.activeGame = card.dataset.gametype; this.renderSongList(); this.showScreen('song-selection-screen'); }));
                this.showScreen('main-menu-screen');
            },
            showScreen(screenId) {
                this.dom.screens.forEach(s => s.classList.remove('active'));
                if (screenId === 'none') {
                    this.dom.gameStats.style.display = 'flex';
                    const gameArea = document.getElementById(`${this.state.activeGame}-game-area`);
                    if(gameArea) gameArea.classList.add('active');
                } else {
                    this.dom.gameStats.style.display = 'none';
                    this.dom.gameUiContainers.forEach(c => c.classList.remove('active'));
                    const screen = document.getElementById(screenId);
                    if (screen) screen.classList.add('active');
                }
            },
            renderSongList() {
                const songList = document.getElementById('song-list');
                songList.innerHTML = '';
                for (const songId in SongData) {
                    const song = SongData[songId];
                    if (song.availableModes.includes(this.state.activeGame)) {
                        const el = document.createElement('div');
                        el.className = 'song-choice'; el.textContent = song.title;
                        el.onclick = () => this.startGame(songId);
                        songList.appendChild(el);
                    }
                }
            },
            async startGame(songId) {
                this.state.currentSongId = songId;
                const song = SongData[songId];
                try {
                    const response = await fetch(song.beatmapSrc);
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    const rawBeatmap = await response.json();
                    this.state.beatmap = rawBeatmap.filter(e => e.type === 'tap' || e.type === 'strong').map(e => ({ time: e.time * 1000, type: e.type }));
                } catch (e) { alert("譜面載入失敗: " + e.message); return; }
                this.state.score = 0; this.state.combo = 0;
                this.dom.score.textContent = 0; this.dom.combo.textContent = 0;
                this.showScreen('none');
                const gameModule = this.modules[this.state.activeGame];
                setTimeout(() => {
                    this.state.isPlaying = true; this.state.startTime = performance.now();
                    this.dom.gameAudio.src = song.audioSrc;
                    this.dom.gameAudio.play().catch(e => console.error("Audio play failed:", e));
                    gameModule.start(this.state.beatmap);
                    this.gameLoop();
                }, 1000);
            },
            gameLoop() {
                if (!this.state.isPlaying) return;
                const elapsedTime = performance.now() - this.state.startTime;
                const gameModule = this.modules[this.state.activeGame];
                gameModule.update(elapsedTime);
                gameModule.draw();
                if (elapsedTime >= SongData[this.state.currentSongId].duration) { this.endGame(); return; }
                this.state.animationFrameId = requestAnimationFrame(this.gameLoop.bind(this));
            },
            handleHit(elapsedTime, hitData) {
                const gameModule = this.modules[this.state.activeGame];
                let noteToHit = null;
                if (this.state.activeGame === 'timebeat') {
                    noteToHit = gameModule.notes.find(n => n.active && n.track === hitData.track && Math.abs(n.time - elapsedTime) < 150);
                } else if (this.state.activeGame === 'conductor') {
                    noteToHit = gameModule.notes.find(n => n.id === hitData.id && n.active && Math.abs(n.time - elapsedTime) < 400);
                } else if (this.state.activeGame === 'turntable') {
                    const judgementRadius = Math.min(window.innerWidth, window.innerHeight) * 0.4 * gameModule.JUDGEMENT_RADIUS_RATIO;
                    noteToHit = gameModule.notes.find(n => {
                        if (!n.active) return false;
                        const currentRadius = judgementRadius * n.radiusRatio;
                        const noteAngle = (gameModule.rotation + n.startAngle + 2 * Math.PI) % (2 * Math.PI);
                        const targetAngle = (gameModule.TONEARM_ANGLE + 2 * Math.PI) % (2 * Math.PI);
                        return Math.abs(currentRadius - judgementRadius) < 40 && Math.abs(noteAngle - targetAngle) < 0.35 && n.type === hitData.type;
                    });
                }
                if (noteToHit) {
                    noteToHit.active = false;
                    const timeDiff = Math.abs(noteToHit.time - elapsedTime);
                    let scoreGain = 0;
                    if (this.state.activeGame === 'turntable') { scoreGain = (noteToHit.type === 'strong' ? 150 : 100); }
                    else { scoreGain = (timeDiff < 80) ? 100 : 50; }
                    this.state.score += scoreGain + this.state.combo;
                    this.updateCombo(true);
                }
            },
            updateCombo(isHit){ if(isHit) this.state.combo++; else this.state.combo = 0; this.dom.combo.textContent = this.state.combo; this.dom.score.textContent = this.state.score; },
            endGame() {
                this.state.isPlaying = false;
                if(this.state.animationFrameId) cancelAnimationFrame(this.state.animationFrameId);
                this.modules[this.state.activeGame].stop();
                this.dom.gameAudio.pause();
                this.dom.finalScore.textContent = this.state.score;
                this.showScreen('end-screen');
            },
            getStartTime: () => Game.state.startTime,
        };
        Game.init();
    });
    </script>
</body>
</html>
