<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>時光迴廊 - 懷舊音樂之旅</title>
    <style>
        :root { --theme-color-1: #ff8c00; --font-family: 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: var(--font-family); overflow: hidden; touch-action: none; background: linear-gradient(135deg, #2a2a3e, #4a3a4a); color: white; user-select: none; -webkit-user-select: none; }
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; justify-content: center; align-items: center; background-color: rgba(0, 0, 0, 0.5); backdrop-filter: blur(5px); text-align: center; transition: opacity 0.5s ease; box-sizing: border-box; padding: 20px; }
        .screen.active { display: flex; }
        h1 { font-size: clamp(2.5rem, 10vw, 3.5rem); text-shadow: 2px 2px 8px rgba(0,0,0,0.8); }
        p { font-size: clamp(1rem, 4vw, 1.2rem); opacity: 0.9; }
        .retro-button { padding: 14px 28px; font-size: clamp(1rem, 4.5vw, 1.2rem); color: white; background: linear-gradient(145deg, var(--theme-color-1), #e06a00); border: 2px solid rgba(255, 255, 255, 0.5); border-radius: 12px; cursor: pointer; margin: 10px; min-width: 150px; box-shadow: 0 4px 0 #a04a00, 2px 2px 8px rgba(0,0,0,0.5); transition: all 0.1s ease-out; text-shadow: 1px 1px 2px rgba(0,0,0,0.7); }
        .retro-button:active { transform: translateY(2px); box-shadow: 0 2px 0 #a04a00; }
        #main-menu-screen { background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://source.unsplash.com/random/800x600/?80s,retro,city') no-repeat center center/cover; }
        #main-menu-screen p { margin: 10px 0 20px 0; }
        .game-choice-container { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; width: 100%; }
        .game-choice-card { width: clamp(130px, 35vw, 160px); height: clamp(180px, 48vw, 220px); margin: 10px; border: 3px solid rgba(255, 255, 255, 0.7); border-radius: 12px; background: rgba(0,0,0,0.4); display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; transition: all 0.3s ease; }
        .game-choice-card:hover { transform: scale(1.05); border-color: var(--theme-color-1); }
        .game-choice-card .icon { font-size: clamp(3rem, 15vw, 4rem); }
        .game-choice-card .title { font-size: clamp(1.2rem, 5vw, 1.5rem); margin-top: 15px; font-weight: bold; }
        #tutorial-screen .tutorial-container { position: relative; width: 100%; max-width: 400px; height: 60vh; max-height: 500px; background: rgba(0, 0, 0, 0.4); border: 2px solid var(--theme-color-1); border-radius: 15px; overflow: hidden; }
        #tutorial-screen h2 { font-size: clamp(1.5rem, 6vw, 2rem); margin: 15px 0; color: var(--theme-color-1); text-shadow: 1px 1px 2px #000; }
        .tutorial-item { position: absolute; width: 100%; height: 100%; opacity: 0; transition: opacity 0.8s ease-in-out; }
        .tutorial-item.active { opacity: 1; }
        .tutorial-text { position: absolute; bottom: 10px; left: 0; width: 100%; font-size: clamp(0.9rem, 4vw, 1.1rem); background: rgba(0,0,0,0.5); padding: 8px 0; z-index: 10;}
        .demo-judgement-line { position: absolute; bottom: 25%; left: 10%; width: 80%; height: 8px; background: gold; border-radius: 4px; box-shadow: 0 0 10px gold; }
        .demo-track { position: absolute; bottom: 25%; width: 2px; height: 65%; background: rgba(255,255,255,0.3); }
        .demo-note { position: absolute; width: 40px; height: 40px; background: cyan; border-radius: 50%; box-shadow: 0 0 15px cyan; transform: translate(-50%, -50%); }
        .demo-finger { width: 50px; height: 50px; background: rgba(255,255,255,0.7); border-radius: 50%; position: absolute; box-shadow: 0 0 15px white; border: 2px solid white; transform: translate(-50%, -50%); opacity: 0; z-index: 5; }
        #song-selection-screen #song-list { width: 100%; max-width: 450px; max-height: 70vh; overflow-y: auto; padding: 10px; }
        .song-choice { background-color: rgba(0,0,0,0.3); border: 2px solid rgba(255,255,255,0.3); border-radius: 10px; padding: 15px; margin-bottom: 15px; cursor: pointer; transition: all 0.2s; position: relative; }
        .song-choice:not(.locked):hover { border-color: var(--theme-color-1); transform: scale(1.02); }
        .song-choice.locked { cursor: not-allowed; background-color: rgba(0,0,0,0.5); color: #888; }
        .song-title { font-size: clamp(1.1rem, 5vw, 1.3rem); font-weight: bold; }
        .song-artist { font-size: clamp(0.8rem, 3.5vw, 1rem); opacity: 0.8; margin-top: 5px; }
        .song-highscore, .song-unlock-condition { font-size: clamp(0.7rem, 3vw, 0.9rem); margin-top: 8px; color: var(--theme-color-1); }
        .lock-icon { font-size: clamp(1.5rem, 6vw, 1.8rem); position: absolute; right: 15px; top: 50%; transform: translateY(-50%); opacity: 0.7; }
        .game-ui-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; pointer-events: none; }
        .game-ui-container.active { display: block; pointer-events: auto; }
        .game-background { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; transition: filter 0.5s ease-out; z-index: -1; }
        #timebeat-game-area canvas, #conductor-canvas { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; }
        #conductor-game-area { cursor: crosshair; }
        .game-stats { position: absolute; top: 20px; left: 20px; right: 20px; z-index: 50; display: flex; justify-content: space-between; font-size: clamp(1rem, 5vw, 1.5rem); color: white; text-shadow: 2px 2px 4px black; pointer-events: auto; }
        #timebeat-game-area .combo-display { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 4rem; font-weight: bold; color: rgba(255, 255, 255, 0.5); opacity: 0; transition: opacity 0.2s, transform 0.2s; }
        #timebeat-game-area .combo-display.show { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
        #end-screen-content { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #leaderboard-screen input { width: 100px; font-size: 24px; text-align: center; background: #333; color: white; border: 2px solid #ccc; border-radius: 5px; margin: 10px 0; text-transform: uppercase; }
        #leaderboard-list { list-style: none; padding: 0; width: 80%; max-width: 350px; margin-top: 20px; }
        #leaderboard-list li { display: flex; justify-content: space-between; padding: 8px; margin-bottom: 5px; background: rgba(255,255,255,0.1); border-radius: 5px; }
        #leaderboard-list li:first-child { background: var(--theme-color-1); font-weight: bold; }
        #poster-button { margin-top: 15px; }
        #poster-preview-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 100; }
        #poster-canvas { border: 2px solid white; border-radius: 10px; max-width: 90vw; max-height: 90vh; object-fit: contain; }
        .first-play-hint { position: absolute; background-color: rgba(0,0,0,0.8); padding: 10px 15px; border-radius: 8px; color: white; font-size: 16px; pointer-events: none; z-index: 200; opacity: 0; animation: feedback-anim 3s forwards; }
        @keyframes note-fall { from { top: 10%; } to { top: 75%; } }
        @keyframes finger-tap { 0%, 100% { opacity: 0; transform: translate(-50%, -50%) scale(1); } 10%, 90% { opacity: 1; } 50% { transform: translate(-50%, -50%) scale(0.9); } }
        @keyframes random-note-appear { 0%, 100% { opacity: 0; transform: scale(0.5); } 10%, 90% { opacity: 1; transform: scale(1); } }
        @keyframes record-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes feedback-anim { 0% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5); } }
    </style>
</head>
<body>
    <div id="main-container">
        <div id="conductor-game-area" class="game-ui-container">
             <div class="game-background"></div> <canvas id="conductor-canvas"></canvas>
        </div>
        <div id="turntable-game-area" class="game-ui-container">
             <div class="game-background"></div>
        </div>
        <div id="timebeat-game-area" class="game-ui-container">
            <div class="game-background"></div> <div class="combo-display"></div> <canvas id="timebeat-canvas"></canvas>
        </div>
        <div class="game-stats" style="display: none;">
            <div>分數: <span id="score">0</span></div> <div>連擊: <span id="combo">0</span></div>
        </div>
    </div>
    <div id="main-menu-screen" class="screen active">
        <h1>時光迴廊</h1> <p>選擇你的懷舊音樂之旅</p>
        <div class="game-choice-container">
            <div class="game-choice-card" data-gametype="timebeat"> <div class="icon">🎶</div> <div class="title">時光節拍</div> </div>
            <div class="game-choice-card" data-gametype="conductor"> <div class="icon">🎼</div> <div class="title">指揮家</div> </div>
            <div class="game-choice-card" data-gametype="turntable"> <div class="icon">💿</div> <div class="title">時光唱盤</div> </div>
        </div>
        <button class="retro-button" id="show-tutorial-btn">玩法示範</button>
    </div>
    <div id="tutorial-screen" class="screen">
        <h2>玩法示範</h2> <div class="tutorial-container"></div> <button class="retro-button" id="skip-tutorial-btn">返回主選單</button>
    </div>
    <div id="song-selection-screen" class="screen">
        <h1 id="song-selection-title">選擇曲目</h1> <div id="song-list"></div> <button class="retro-button" id="back-to-main-menu-btn">返回主選單</button>
    </div>
    <div id="end-screen" class="screen">
        <div id="end-screen-content">
            <h1 id="end-title">演奏結束</h1>
            <p style="font-size: 24px;">最終得分: <span id="final-score">0</span></p>
            <p>最高連擊: <span id="max-combo">0</span></p>
            <p>準確率: <span id="accuracy">0%</span></p>
            <p style="font-size: 32px; font-weight: bold; color: gold;">評級: <span id="rating-badge"></span></p>
            <button id="poster-button" class="retro-button">生成勳章海報</button>
            <button id="view-leaderboard-btn" class="retro-button">查看排行榜</button>
            <button id="retry-button" class="retro-button">再次嘗試</button>
            <button id="back-to-song-menu-btn" class="retro-button">返回選曲</button>
        </div>
    </div>
    <div id="leaderboard-screen" class="screen">
        <h1 id="leaderboard-title">歌曲排行榜</h1>
        <div id="name-prompt" style="display: none;">
            <h3>恭喜創下新紀錄！請留下你的大名 (3個字母)：</h3>
            <input type="text" id="player-name-input" maxlength="3" value="AAA">
            <button id="submit-score-btn" class="retro-button">提交分數</button>
        </div>
        <ol id="leaderboard-list"></ol>
        <button class="retro-button" id="back-from-leaderboard-btn">返回</button>
    </div>
    <div id="poster-preview-container"> <canvas id="poster-canvas"></canvas> </div>
    <audio id="game-audio" preload="auto"></audio>

    <script>
    // =================================================================================
    //  時光迴廊 H5 遊戲 - 統一程式碼框架 v2.9 (重構穩定版)
    // =================================================================================
    document.addEventListener('DOMContentLoaded', () => {

    const allScreens = document.querySelectorAll('.screen');
    const gameUIs = document.querySelectorAll('.game-ui-container');
    const gameStatsEl = document.querySelector('.game-stats');
    const gameAudio = document.getElementById('game-audio');

    const Game = {
        state: { activeGame: null, currentSongId: null, score: 0, combo: 0, maxCombo: 0, hits: { perfect: 0, good: 0, miss: 0 }, totalNotes: 0, accuracy: 0, rating: 'C', isPlaying: false, isFirstPlay: { conductor: true, turntable: true, timebeat: true }, startTime: null, animationFrameId: null, },
        init() {
            try { const firstPlayData = localStorage.getItem('isFirstPlay'); if (firstPlayData) this.state.isFirstPlay = JSON.parse(firstPlayData); } catch (e) { console.error("讀取本地存檔失敗:", e); }
            document.querySelectorAll('.game-choice-card').forEach(card => card.addEventListener('click', () => { this.state.activeGame = card.dataset.gametype; this.showScreen('song-selection-screen'); SongSelection.render(); }));
            document.getElementById('back-to-main-menu-btn').addEventListener('click', () => this.showScreen('main-menu-screen'));
            document.getElementById('show-tutorial-btn').addEventListener('click', () => { this.showScreen('tutorial-screen'); Tutorial.start(); });
            document.getElementById('skip-tutorial-btn').addEventListener('click', () => { Tutorial.stop(); this.showScreen('main-menu-screen'); });
            document.getElementById('retry-button').addEventListener('click', () => this.startGame(this.state.currentSongId));
            document.getElementById('back-to-song-menu-btn').addEventListener('click', () => { this.showScreen('song-selection-screen'); SongSelection.render(); });
            document.getElementById('view-leaderboard-btn').addEventListener('click', () => Leaderboard.show());
            document.getElementById('poster-button').addEventListener('click', () => this.generatePoster());
            Leaderboard.init();
            this.showScreen('main-menu-screen');
        },
        showScreen(screenId) {
            allScreens.forEach(s => s.classList.remove('active'));
            const activeScreen = document.getElementById(screenId);
            if (activeScreen) activeScreen.classList.add('active');
        },
        startGame(songId) {
            if (this.state.isFirstPlay[this.state.activeGame]) { this.showFirstPlayHint(); this.state.isFirstPlay[this.state.activeGame] = false; try { localStorage.setItem('isFirstPlay', JSON.stringify(this.state.isFirstPlay)); } catch (e) { console.error("儲存本地進度失敗:", e); } }
            Object.assign(this.state, { currentSongId: songId, score: 0, combo: 0, maxCombo: 0, hits: { perfect: 0, good: 0, miss: 0 }, isPlaying: true, startTime: null, });
            if(this.state.animationFrameId) cancelAnimationFrame(this.state.animationFrameId);
            allScreens.forEach(s => s.classList.remove('active'));
            gameUIs.forEach(ui => ui.classList.remove('active'));
            const gameArea = document.getElementById(`${this.state.activeGame}-game-area`);
            if (gameArea) gameArea.classList.add('active');
            gameStatsEl.style.display = 'flex';
            document.getElementById('score').textContent = 0; document.getElementById('combo').textContent = 0;
            const songData = SongData[this.state.activeGame][songId];
            gameAudio.src = songData.audioSrc; gameAudio.currentTime = 0;
            const gameModule = { timebeat: TimeBeat, conductor: Conductor, turntable: Turntable }[this.state.activeGame];
            if (gameModule && gameModule.start) {
                const bgContainer = gameArea.querySelector('.game-background');
                if (bgContainer) { bgContainer.style.backgroundImage = `url('${songData.backgroundSrc}')`; }
                gameModule.start();
            }
        },
        endGame() {
            if (!this.state.isPlaying) return;
            this.state.isPlaying = false;
            if(this.state.animationFrameId) { cancelAnimationFrame(this.state.animationFrameId); this.state.animationFrameId = null; }
            gameAudio.pause();
            gameStatsEl.style.display = 'none';
            const totalHits = this.state.hits.perfect + this.state.hits.good;
            this.state.accuracy = this.state.totalNotes > 0 ? (totalHits / this.state.totalNotes) * 100 : 0;
            let rating = 'C';
            if (this.state.accuracy >= 98) rating = 'S'; else if (this.state.accuracy > 90) rating = 'A'; else if (this.state.accuracy > 80) rating = 'B';
            this.state.rating = rating;
            const songData = SongData[this.state.activeGame][this.state.currentSongId];
            document.getElementById('end-title').textContent = songData.title;
            document.getElementById('final-score').textContent = this.state.score;
            document.getElementById('max-combo').textContent = this.state.maxCombo;
            document.getElementById('accuracy').textContent = `${this.state.accuracy.toFixed(2)}%`;
            document.getElementById('rating-badge').textContent = this.state.rating;
            this.showScreen('end-screen');
            Leaderboard.checkNewScore(this.state.score);
        },
        showFirstPlayHint() {
            const hintText = { timebeat: '跟隨節拍，點擊下落的音符！', conductor: '跟隨光標，劃出指揮的弧線！', turntable: '玩法待開發' }[this.state.activeGame];
            const hintEl = document.createElement('div');
            hintEl.className = 'first-play-hint'; hintEl.textContent = hintText; hintEl.style.top = '30%'; hintEl.style.left = '50%'; hintEl.style.transform = 'translateX(-50%)';
            document.body.appendChild(hintEl);
            setTimeout(() => hintEl.remove(), 3000);
        },
        generatePoster() { /* ... */ }
    };
    
    const SongData = {
        timebeat: { tianmimi: { title: '甜蜜蜜', artist: '鄧麗君', unlockScore: 0, duration: 21000, audioSrc: 'https://cdn.jsdelivr.net/gh/c-at/music-box@main/audio/甜蜜蜜.mp3', backgroundSrc: 'https://source.unsplash.com/random/800x600/?sweet,love', notes: [ {time:2000,type:"tap"},{time:3200,type:"tap"},{time:4500,type:"strong"},{time:7000,type:"tap"},{time:8200,type:"tap"},{time:9400,type:"tap"},{time:10600,type:"strong"},{time:11800,type:"tap"},{time:14000,type:"tap"},{time:15200,type:"tap"},{time:16500,type:"strong"},{time:17800,type:"tap"},{time:19000,type:"tap"} ]}},
        conductor: { song1: { title: '滄海一聲笑', artist: '許冠傑', unlockScore: 0, duration: 22000, audioSrc: 'https://cdn.jsdelivr.net/gh/c-at/music-box@main/audio/滄海一聲笑.mp3', backgroundSrc: 'https://source.unsplash.com/random/800x600/?sea,boat,retro', notes: [ { type: 'tap', time: 1500, pos: { x: 50, y: 50 } }, { type: 'tap', time: 2500, pos: { x: 30, y: 40 } }, { type: 'tap', time: 3500, pos: { x: 70, y: 60 } }, { type: 'slide', time: 5000, duration: 2500, startPos: { x: 20, y: 80 }, controlPos: { x: 50, y: 20 }, endPos: { x: 80, y: 80 } }, { type: 'tap', time: 8000, pos: { x: 50, y: 50 } }, { type: 'slide', time: 9500, duration: 3000, startPos: { x: 80, y: 20 }, controlPos: { x: 10, y: 50 }, endPos: { x: 80, y: 80 } }, { type: 'tap', time: 13000, pos: { x: 20, y: 20 } }, { type: 'tap', time: 13500, pos: { x: 80, y: 20 } }, { type: 'tap', time: 14000, pos: { x: 50, y: 50 } }, ] } },
        turntable: { song1: { title: '忘情水', artist: '劉德華', unlockScore: 0, duration: 15000, audioSrc: '#', backgroundSrc: 'https://source.unsplash.com/random/800x600/?water,sad', notes: [] } }
    };
    const SongOrder = { timebeat: ['tianmimi'], conductor: ['song1'], turntable: ['song1'], };
    
    const Leaderboard = { playerProgress: {}, leaderboards: {}, init() { try { const p = localStorage.getItem('playerProgress'); if(p) this.playerProgress=JSON.parse(p); const l = localStorage.getItem('leaderboards'); if(l) this.leaderboards=JSON.parse(l); } catch(e){} document.getElementById('submit-score-btn').addEventListener('click',()=>this.submitScore()); document.getElementById('back-from-leaderboard-btn').addEventListener('click',()=>Game.showScreen('end-screen')); }, getScores(g,s){if(!this.leaderboards[g])this.leaderboards[g]={};if(!this.leaderboards[g][s])this.leaderboards[g][s]=[];return this.leaderboards[g][s];}, addScore(g,s,n,c){const o=this.getScores(g,s);o.push({name:n,score:c});o.sort((a,b)=>b.score-a.score);this.leaderboards[g][s]=o.slice(0,5);this.save();}, checkNewScore(c){const g=Game.state.activeGame,s=Game.state.currentSongId;const o=this.getScores(g,s);document.getElementById('name-prompt').style.display=o.length<5||c>o[o.length-1].score?'block':'none';if(!this.playerProgress[g])this.playerProgress[g]={};const p=this.playerProgress[g][s]||0;if(c>p){this.playerProgress[g][s]=c;this.save();}}, submitScore(){const n=document.getElementById('player-name-input');const v=n.value.toUpperCase()||'AAA';this.addScore(Game.state.activeGame,Game.state.currentSongId,v,Game.state.score);document.getElementById('name-prompt').style.display='none';this.render();n.value="AAA";}, render(){const g=Game.state.activeGame,s=Game.state.currentSongId;const t=SongData[g][s].title;document.getElementById('leaderboard-title').textContent=`《${t}》排行榜`;const l=document.getElementById('leaderboard-list');l.innerHTML='';const o=this.getScores(g,s);if(o.length===0){l.innerHTML='<li>暫無記錄，快來爭奪第一！</li>';}else{o.forEach((e,i)=>{const d=document.createElement('li');d.innerHTML=`<span>#${i+1} ${e.name}</span><span>${e.score}</span>`;l.appendChild(d);});}}, show(){Game.showScreen('leaderboard-screen');this.render();}, save(){try{localStorage.setItem('playerProgress',JSON.stringify(this.playerProgress));localStorage.setItem('leaderboards',JSON.stringify(this.leaderboards));}catch(e){}} };
    const SongSelection = { render() { const g=Game.state.activeGame;const t={timebeat:'時光金曲',conductor:'指揮樂章',turntable:'懷舊唱盤'};document.getElementById('song-selection-title').textContent=t[g]||'選擇曲目';const c=document.getElementById('song-list');c.innerHTML='';const p=Leaderboard.playerProgress;SongOrder[g].forEach((s,i)=>{const o=SongData[g][s];const n=i>0?SongOrder[g][i-1]:null;const a=!n||(p[g]&&(p[g][n]||0)>=o.unlockScore);const e=document.createElement('div');e.className='song-choice'+(a?'':' locked');if(a){const h=p[g]&&p[g][s]?`<div class="song-highscore">最高分: ${p[g][s]}</div>`:'';e.innerHTML=`<div class="song-title">${o.title}</div><div class="song-artist">${o.artist}</div>${h}`;e.addEventListener('click',()=>Game.startGame(s));}else{const r=SongData[g][n].title;e.innerHTML=`<div class="song-title">${o.title}</div><div class="song-artist">${o.artist}</div><div class="song-unlock-condition">完成《${r}》並獲得 ${o.unlockScore} 分以解鎖</div><div class="lock-icon">🔒</div>`;}c.appendChild(e);}); } };
